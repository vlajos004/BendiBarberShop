<script type="module">
import { auth, db, loadPublic, onAuthStateChanged, signOut, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp,
  esc, toast, authError, ping, fmtFt, authFormHTML, submitAuth, loadProfile, resetPassword, reveal } from './common.js?v=8';

const $ = id => document.getElementById(id);
const ORDER = { new: ['Beérkezett', 'warn'], ready: ['Átvehető', 'ok'], done: ['Átvéve', 'muted'], cancelled: ['Lemondva', 'muted'] };
let S, user = null, profile = null, isAdmin = false, products = [], orders = [], regProfile = null, authTab = 'login', sending = false, checkout = false;
let cart = {};
try { cart = JSON.parse(localStorage.getItem('bendi-cart') || '{}') || {}; } catch (e) { cart = {}; }
const saveCart = () => { try { localStorage.setItem('bendi-cart', JSON.stringify(cart)); } catch (e) {} };
const lines = () => Object.entries(cart).map(([id, q]) => ({ p: products.find(x => x.id === id), q })).filter(l => l.p && l.q > 0);
const total = () => lines().reduce((s, l) => s + l.q * (Number(l.p.price) || 0), 0);
const left = p => p.stock == null || p.stock === '' ? Infinity : Number(p.stock);

function render(){
  const el = $('shop');
  if (!S.shopEnabled && !isAdmin) {
    el.innerHTML = `<div class="section-head"><span class="kicker">Webshop</span><h2>Hamarosan</h2><p>A webshop még nem nyitott meg. Addig is <a href="index.html#foglalas" style="color:var(--red)">foglalj időpontot</a>.</p></div>`;
    $('bar').classList.remove('show'); return;
  }
  const L = lines();
  el.innerHTML = `${!S.shopEnabled ? '<div class="preview-banner"><b>Rejtett előnézet.</b> A webshop ki van kapcsolva, ezt csak te látod adminként. Bekapcsolni az admin felület Webshop fülén tudod.</div>' : ''}
    <div class="section-head" data-reveal><span class="kicker">Webshop</span><h2>Termékek</h2><p>Foglald le online, és fizess a szalonban átvételkor. Ha átvehető, e-mailt küldünk.</p></div>
    ${products.length ? `<div class="products">${products.map((p, i) => { const n = cart[p.id] || 0, out = left(p) <= 0;
      return `<article class="product" id="p-${p.id}" data-reveal style="--d:${Math.min(i, 6) * 60}ms">
        <div class="ph" style="${p.img ? `background-image:url('${p.img}')` : ''}">${p.img ? '' : 'Nincs kép'}</div>
        <div class="pb"><h3>${esc(p.name)}</h3><p class="desc">${esc(p.desc || '')}</p><p class="price">${fmtFt(p.price)}</p>
          ${out ? '<span class="badge b-muted" style="justify-self:start">Elfogyott</span>' : left(p) < 5 ? `<span class="badge b-warn" style="justify-self:start">Még ${left(p)} db</span>` : ''}</div>
        <div class="pf">${n ? `<span class="qty"><button data-q="${p.id}" data-d="-1" aria-label="Kevesebb">−</button><b>${n}</b><button data-q="${p.id}" data-d="1" aria-label="Több" ${n >= left(p) ? 'disabled' : ''}>+</button></span>` : ''}
          <button class="btn ${n ? 'btn-line' : 'btn-red'} btn-sm" data-q="${p.id}" data-d="1" ${out || n >= left(p) ? 'disabled' : ''}>${n ? 'Még egy' : 'Kosárba'}</button></div></article>`; }).join('')}</div>`
      : '<p class="hint">Még nincs feltöltött termék.</p>'}
    <div id="checkout" style="margin-top:40px;max-width:640px" ${checkout && L.length ? '' : 'hidden'}>
      <div class="mine" style="margin:0"><h3>Rendelés</h3>
        ${L.map(l => `<div class="mb"><div><b>${esc(l.p.name)}</b><br><span class="hint">${l.q} × ${fmtFt(l.p.price)}</span></div><b>${fmtFt(l.q * l.p.price)}</b></div>`).join('')}
        <div class="mb"><span>Összesen, fizetés a szalonban</span><b style="font:800 1.3rem var(--display)">${fmtFt(total())}</b></div>
        <div style="margin-top:12px" id="co-body"></div></div></div>
    <div class="mine" id="my-orders" ${user && orders.length ? '' : 'hidden'} style="margin-top:24px;max-width:640px"><h3>Rendeléseid</h3>
      ${orders.map(o => `<div class="mb"><div><b>${o.items.map(i => esc(i.name) + (i.qty > 1 ? ' ×' + i.qty : '')).join(', ')}</b><br><span class="hint">${fmtFt(o.total)}</span></div>
        <div style="text-align:right"><span class="badge b-${(ORDER[o.status] || ['', 'muted'])[1]}">${(ORDER[o.status] || [o.status])[0]}</span>${o.status === 'new' ? `<br><button class="linkish" data-ocancel="${o.id}" style="margin-top:8px">Lemondom</button>` : ''}</div></div>`).join('')}</div>`;
  renderCheckout(); renderBar(); reveal();
}
function renderCheckout(){
  const el = $('co-body'); if (!el) return;
  if (!user) { el.innerHTML = '<p class="hint" style="margin-bottom:6px">A rendeléshez lépj be vagy regisztrálj (ugyanaz a fiók, mint az időpontfoglalásnál).</p>' + authFormHTML(authTab); return; }
  el.innerHTML = `<div class="who"><span>Bejelentkezve: <b>${esc(profile?.name || user.email)}</b></span><button class="linkish" data-act="logout">Kilépés</button></div>
    <label class="field"><span>Megjegyzés (nem kötelező)</span><textarea name="note" id="note" rows="2" maxlength="300"></textarea></label>
    <div class="recap"><p>${fmtFt(total())}<small>Fizetés a szalonban, átvételkor</small></p><button class="btn btn-red" data-act="order" ${sending ? 'disabled' : ''}>${sending ? 'Küldés…' : 'Lefoglalom'}</button></div><p class="err" id="o-err"></p>`;
}
function renderBar(){
  const L = lines(), n = L.reduce((s, l) => s + l.q, 0), bar = $('bar');
  bar.classList.toggle('always', n > 0); bar.classList.toggle('show', n > 0 && !checkout);
  if (n) bar.innerHTML = `<p><b>Kosár: ${n} termék</b>${fmtFt(total())}</p><button class="btn btn-line btn-sm" data-act="clear">Ürítés</button><button class="btn btn-red" data-act="tocheckout">Tovább</button>`;
}
function renderAcct(){ $('acct').innerHTML = user ? `<span class="pill">${esc((profile?.name || user.email).split(' ').pop())}</span>` : ''; }

async function loadOrders(){
  if (!user) { orders = []; return; }
  const s = await getDocs(query(collection(db, 'orders'), where('uid', '==', user.uid)));
  orders = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdMs || 0) - (a.createdMs || 0)).slice(0, 10);
}
async function placeOrder(){
  const L = lines(); if (!L.length || sending) return;
  const note = ($('note')?.value || '').trim().slice(0, 300);  // újrarajzolás előtt olvassuk ki
  sending = true; renderCheckout();
  try {
    const items = L.map(l => ({ pid: l.p.id, name: l.p.name, price: Number(l.p.price) || 0, qty: l.q }));
    const ref = doc(collection(db, 'orders')), b = writeBatch(db);
    // shortcut: az árat és a készletet a böngésző küldi; mivel a vendég a szalonban fizet, Bendi a valós árat kéri el. Online fizetésnél ezt szerveren kell ellenőrizni.
    b.set(ref, { uid: user.uid, name: profile?.name || user.displayName || user.email.split('@')[0], email: user.email, phone: profile?.phone || '',
      items, total: items.reduce((s, i) => s + i.price * i.qty, 0), note,
      status: 'new', notified: false, mailed: true, created: serverTimestamp(), createdMs: Date.now() });
    await b.commit(); ping();
    cart = {}; saveCart(); checkout = false; sending = false;
    await loadOrders(); render(); $('my-orders').scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Lefoglaltad. Ha átvehető, e-mailt kapsz.');
  } catch (e) { console.error(e); sending = false; renderCheckout(); if ($('note')) $('note').value = note; const er = $('o-err'); if (er) er.textContent = 'A rendelés nem sikerült. Próbáld újra, vagy hívd fel Bendit.'; }
}
async function cancelOrder(id){
  if (!confirm('Lemondod ezt a rendelést?')) return;
  try { const b = writeBatch(db); b.update(doc(db, 'orders', id), { status: 'cancelled', cancelledBy: 'guest' }); await b.commit(); ping(); await loadOrders(); render(); toast('Lemondtad a rendelést.'); }
  catch (e) { console.error(e); toast('Nem sikerült lemondani. Hívd fel Bendit.'); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-q],[data-act],[data-tab],[data-ocancel]'); if (!t) return;
  const d = t.dataset;
  if (d.q) { const p = products.find(x => x.id === d.q); cart[d.q] = Math.max(0, Math.min(left(p), (cart[d.q] || 0) + Number(d.d))); if (!cart[d.q]) delete cart[d.q]; saveCart(); render(); }
  else if (d.tab) { authTab = d.tab; renderCheckout(); }
  else if (d.ocancel) cancelOrder(d.ocancel);
  else if (d.act === 'tocheckout') { checkout = true; render(); $('checkout').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (d.act === 'clear') { cart = {}; saveCart(); checkout = false; render(); }
  else if (d.act === 'order') placeOrder();
  else if (d.act === 'logout') signOut(auth);
  else if (d.act === 'reset') resetPassword();
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'auth-form') return; e.preventDefault();
  const err = $('auth-err'); err.textContent = '';
  try { const p = await submitAuth(authTab, Object.fromEntries(new FormData(e.target)), x => regProfile = x); if (p) { profile = p; renderCheckout(); renderAcct(); } }
  catch (x) { regProfile = null; err.textContent = x.msg || authError(x); }
});

S = await loadPublic();
async function loadProducts(){
  const s = await getDocs(collection(db, 'products'));
  products = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.visible !== false).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
if (S.shopEnabled) { try { await loadProducts(); } catch (e) { console.error(e); } }
render();
onAuthStateChanged(auth, async u => {
  user = u; profile = u ? await loadProfile(u, regProfile) : null; isAdmin = false;
  if (u) { try { isAdmin = (await getDoc(doc(db, 'admins', u.uid))).exists(); } catch (e) {} }
  if (isAdmin && !S.shopEnabled && !products.length) { try { await loadProducts(); } catch (e) { console.error(e); } }
  try { await loadOrders(); } catch (e) { console.error(e); }
  render(); renderAcct();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: 'center' });
});
</script>
</body>
</html>
