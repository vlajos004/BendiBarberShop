function stockLine(p){
  const n = left(p);
  return n <= 0 ? '<span class="stock out"><i></i>Elfogyott</span>' : n < 5 ? `<span class="stock low"><i></i>Még ${n} db</span>` : '<span class="stock in"><i></i>Készleten</span>';
}

/* ---------- oldal ---------- */
function render(){
  if (!S.shopEnabled && !isAdmin) {
    $('shop').innerHTML = `<section class="block shop-closed"><div class="wrap"><div class="section-head"><span class="kicker">Webshop</span><h1>Hamarosan nyitunk</h1>
      <p>A webshop még nem nyitott meg. Addig is foglalj időpontot.</p></div><a class="btn btn-red" href="index.html#foglalas">Időpontot foglalok <span class="arrow" aria-hidden="true">→</span></a></div></section>`;
    $('cartFab').hidden = true; built = false; return;
  }
  if (!built) {
    const cats = [...new Set(products.map(p => (p.category || '').trim()).filter(Boolean))];
    $('shop').innerHTML = `${!S.shopEnabled ? '<div class="wrap" style="padding-top:24px"><div class="preview-banner"><b>Rejtett előnézet.</b> A webshop ki van kapcsolva, ezt csak te látod adminként. Bekapcsolni az admin felület Webshop fülén tudod.</div></div>' : ''}
      <section class="shop-hero"><div class="wrap">
        <span class="kicker">Webshop</span><h1>Bendi termékek</h1>
        <p class="lead">Amit a szalonban is használok. Foglald le online, és fizess átvételkor a szalonban.</p>
        <ul class="trust"><li>${CHECK}Átvétel a szalonban</li><li>${CHECK}Fizetés átvételkor</li><li>${CHECK}E-mailt kapsz, ha kész</li></ul>
      </div></section>
      <section class="shop-main"><div class="wrap">
        <div class="toolbar">
          <div class="chips" role="group" aria-label="Kategória">${['', ...cats].map(c => `<button type="button" class="chip-f ${f.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${c ? esc(c) : 'Összes'}</button>`).join('')}</div>
          <div class="tools"><label class="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Keresés" value="${esc(f.q)}" aria-label="Keresés a termékek között"></label>
            <select id="sort" aria-label="Rendezés"><option value="rec">Ajánlott</option><option value="pa">Ár szerint ↑</option><option value="pd">Ár szerint ↓</option><option value="name">Név szerint</option></select></div>
        </div>
        <p class="result" id="result"></p>
        <div class="pgrid" id="grid"></div>
        <div class="shop-actions"><a class="btn btn-line" href="index.html">← Vissza a főoldalra</a><button type="button" class="btn btn-red" data-act="cart" id="cartBig"></button></div>
        <div id="orders"></div>
      </div></section>`;
    $('sort').value = f.sort; built = true;
  }
  renderGrid(); renderOrders(); renderCart();
}
function renderGrid(){
  const q = f.q.trim().toLowerCase();
  let list = products.filter(p => (!f.cat || (p.category || '').trim() === f.cat) && (!q || (p.name + ' ' + (p.desc || '') + ' ' + (p.category || '')).toLowerCase().includes(q)));
  if (f.sort === 'pa') list.sort((a, b) => a.price - b.price); else if (f.sort === 'pd') list.sort((a, b) => b.price - a.price); else if (f.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'hu'));
  $('result').textContent = products.length ? `${list.length} termék` : '';
  $('grid').innerHTML = !products.length ? '<div class="empty-shop">Még nincs feltöltött termék.</div>' : !list.length ? '<div class="empty-shop">Nincs találat. Próbálj másik keresést vagy kategóriát.</div>'
    : list.map((p, i) => { const out = left(p) <= 0, n = cart[p.id] || 0;
      return `<article class="pcard ${out ? 'is-out' : ''}" id="p-${p.id}" data-reveal style="--d:${Math.min(i, 8) * 50}ms">
        <button type="button" class="pc-img" data-open="${p.id}" aria-label="${esc(p.name)} részletei">${img(p)}${p.category ? `<span class="pc-cat">${esc(p.category)}</span>` : ''}${out ? '<span class="pc-out">Elfogyott</span>' : ''}</button>
        <div class="pc-body"><button type="button" class="pc-name" data-open="${p.id}">${esc(p.name)}</button><p class="pc-desc">${esc(p.desc || '')}</p>
          <div class="pc-foot"><span class="pc-price">${fmtFt(p.price)}</span>
          ${n ? `<span class="qty pc-qty"><button data-cq="${p.id}" data-d="-1" aria-label="Egyel kevesebb: ${esc(p.name)}">−</button><b aria-live="polite">${n}</b><button data-cq="${p.id}" data-d="1" aria-label="Még egy: ${esc(p.name)}" ${n >= left(p) ? 'disabled' : ''}>+</button></span>`
            : `<button type="button" class="pc-add" data-add="${p.id}" ${out ? 'disabled' : ''} aria-label="${esc(p.name)} kosárba">${BAG}<span class="plus">+</span></button>`}</div></div></article>`; }).join('');
  reveal();
}
function renderOrders(){
  const el = $('orders'); if (!el) return;
  el.innerHTML = user && orders.length ? `<div class="my-orders"><h2>Rendeléseid</h2>${orders.map(o => `<div class="ord"><div class="ord-h"><b>${orderNo(o.id)}</b><span class="badge b-${(ORDER[o.status] || ['', 'muted'])[1]}">${(ORDER[o.status] || [o.status])[0]}</span></div>
    <p>${o.items.map(i => esc(i.name) + (i.qty > 1 ? ' × ' + i.qty : '')).join(', ')}</p><div class="ord-f"><span>${fmtFt(o.total)}</span>${o.status === 'new' ? `<button class="linkish" data-ocancel="${o.id}">Lemondom</button>` : ''}</div></div>`).join('')}</div>` : '';
}

/* ---------- termék részletei ---------- */
function openProduct(id){
  const p = P(id); if (!p) return;
  pdId = id; pdQty = 1; renderPd(); if (!$('pd').open) $('pd').showModal();
  history.replaceState(null, '', '#p-' + id);
}
function renderPd(){
  const p = P(pdId), out = left(p) <= 0, room = Math.max(0, left(p) - (cart[p.id] || 0));
  pdQty = Math.max(1, Math.min(pdQty, room || 1));
  $('pdIn').innerHTML = `<button class="x" data-act="pdclose" aria-label="Bezárás">✕</button>
    <div class="pd-img">${img(p)}</div>
    <div class="pd-info">${p.category ? `<span class="kicker">${esc(p.category)}</span>` : ''}<h2>${esc(p.name)}</h2>
      <p class="pd-price">${fmtFt(p.price)}</p>${stockLine(p)}
      ${p.desc ? `<p class="pd-desc">${esc(p.desc).replace(/\n/g, '<br>')}</p>` : ''}
      <div class="pd-buy"><span class="qty"><button data-pq="-1" aria-label="Kevesebb" ${pdQty <= 1 ? 'disabled' : ''}>−</button><b>${pdQty}</b><button data-pq="1" aria-label="Több" ${pdQty >= room ? 'disabled' : ''}>+</button></span>
        <button class="btn btn-red" data-act="pdadd" ${out || !room ? 'disabled' : ''}>${out ? 'Elfogyott' : !room ? 'A teljes készlet a kosaradban' : 'Kosárba ' + BAG}</button></div>
      <ul class="pd-notes"><li>${CHECK}Átvétel a szalonban, nyitvatartási időben</li><li>${CHECK}Fizetés átvételkor, előre nem kell fizetni</li><li>${CHECK}E-mailt kapsz, amikor átveheted</li></ul></div>`;
}

/* ---------- kosár ---------- */
function add(id, n = 1){
  const p = P(id); if (!p) return;
  const before = cart[id] || 0, after = Math.min(left(p), before + n); if (after === before) return;
  cart[id] = after; saveCart(); renderGrid(); renderCart();
  toast(`Kosárba tetted: ${p.name}${after - before > 1 ? ' × ' + (after - before) : ''}`);
}
function setQty(id, q){ const p = P(id); if (!p) return; q = Math.max(0, Math.min(left(p), q)); if (q) cart[id] = q; else delete cart[id]; saveCart(); renderGrid(); renderCart(); }
function renderCart(){
  const n = count();
  const big = $('cartBig'); if (big) { big.disabled = !n; big.innerHTML = n ? `${BAG} Kosár megnyitása · ${n} termék, ${fmtFt(total())}` : `${BAG} A kosarad még üres`; }
  $('cartFab').hidden = !n || $('drawer').open; $('fabTxt').innerHTML = `${n} termék · <b>${fmtFt(total())}</b>`;
  if ($('drawer').open) renderDrawer();
}
function openCart(){ if (step === 'done') step = 'cart'; renderDrawer(); if (!$('drawer').open) $('drawer').showModal(); $('cartFab').hidden = true; }
function closeCart(){ $('drawer').close(); }
function renderDrawer(){
  const L = lines(), el = $('drIn');
  const head = t => `<div class="dr-head">${step === 'checkout' ? '<button class="dr-back" data-act="back" aria-label="Vissza a kosárhoz">←</button>' : ''}<h2>${t}</h2><button class="x" data-act="close" aria-label="Bezárás">✕</button></div>`;
  if (step === 'done' && lastOrder) {
    el.innerHTML = head('Köszönöm!') + `<div class="dr-body dr-done"><div class="tick" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3>Megkaptam a rendelésed</h3><p class="ordno">Rendelésszám: <b>${orderNo(lastOrder.id)}</b></p>
      <p>Visszaigazolást küldtem a(z) <b>${esc(user?.email || '')}</b> címre. Ha összekészítettem, újra írok, és a szalonban átveheted. Fizetés átvételkor.</p>
      <div class="dr-sum">${lastOrder.items.map(i => `<div><span>${i.qty} × ${esc(i.name)}</span><span>${fmtFt(i.qty * i.price)}</span></div>`).join('')}<div class="tot"><span>Összesen</span><span>${fmtFt(lastOrder.total)}</span></div></div></div>
      <div class="dr-foot"><button class="btn btn-line" data-act="close" style="width:100%">Vissza a vásárláshoz</button></div>`;
    return;
  }
  if (!L.length) { step = 'cart'; el.innerHTML = head('Kosár') + `<div class="dr-body dr-empty">${BAG}<p>A kosarad üres.</p><button class="btn btn-line btn-sm" data-act="close">Vásárlás folytatása</button></div>`; return; }
  if (step === 'checkout') {
    const keep = !user && el.querySelector('#auth-form') && el.dataset.tab === authTab && el.dataset.step === 'checkout';
    if (keep) return;
    el.dataset.tab = authTab; el.dataset.step = 'checkout';
    el.innerHTML = head('Rendelés') + `<div class="dr-body">
      <div class="dr-sum">${L.map(l => `<div><span>${l.q} × ${esc(l.p.name)}</span><span>${fmtFt(l.q * l.p.price)}</span></div>`).join('')}<div class="tot"><span>Összesen</span><span>${fmtFt(total())}</span></div></div>
      <div class="dr-pay"><b>Fizetés a szalonban, átvételkor.</b> Most csak lefoglalod a termékeket.</div>
      ${user ? `<div class="who"><span>Bejelentkezve: <b>${esc(profile?.name || user.email)}</b><br><span class="hint">${esc(user.email)}</span></span><button class="linkish" data-act="logout">Kilépés</button></div>
        <label class="field"><span>Megjegyzés (nem kötelező)</span><textarea id="note" rows="3" maxlength="300" placeholder="Pl. mikor jönnél érte"></textarea></label>`
        : `<p class="hint" style="margin:18px 0 6px">A rendeléshez lépj be, vagy regisztrálj (ugyanaz a fiók, mint az időpontfoglalásnál).</p>${authFormHTML(authTab)}`}
      <p class="err" id="o-err"></p></div>
      ${user ? `<div class="dr-foot"><button class="btn btn-red" data-act="order" style="width:100%" ${sending ? 'disabled' : ''}>${sending ? 'Küldés…' : 'Rendelés leadása · ' + fmtFt(total())}</button></div>` : ''}`;
    return;
  }
  el.dataset.step = 'cart';
  el.innerHTML = head(`Kosár <small>${count()}</small>`) + `<div class="dr-body"><ul class="cl">${L.map(l => `<li>
      <button class="cl-img" data-open="${l.p.id}" aria-label="${esc(l.p.name)}">${img(l.p)}</button>
      <div class="cl-mid"><b>${esc(l.p.name)}</b><span>${fmtFt(l.p.price)} / db</span>
        <span class="qty sm"><button data-cq="${l.p.id}" data-d="-1" aria-label="Kevesebb">−</button><b>${l.q}</b><button data-cq="${l.p.id}" data-d="1" aria-label="Több" ${l.q >= left(l.p) ? 'disabled' : ''}>+</button></span></div>
      <div class="cl-end"><b>${fmtFt(l.q * l.p.price)}</b><button class="linkish" data-rm="${l.p.id}">Törlés</button></div></li>`).join('')}</ul></div>
    <div class="dr-foot"><div class="tot"><span>Összesen</span><b>${fmtFt(total())}</b></div><p class="hint">Fizetés a szalonban, átvételkor.</p>
      <button class="btn btn-red" data-act="checkout" style="width:100%">Tovább a rendeléshez <span class="arrow" aria-hidden="true">→</span></button></div>`;
}

/* ---------- rendelés ---------- */
async function loadOrders(){
  if (!user) { orders = []; return; }
  const s = await getDocs(query(collection(db, 'orders'), where('uid', '==', user.uid)));
  orders = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdMs || 0) - (a.createdMs || 0)).slice(0, 10);
}
async function placeOrder(){
  const L = lines(); if (!L.length || sending) return;
  const note = ($('note')?.value || '').trim().slice(0, 300);  // újrarajzolás előtt olvassuk ki
  sending = true; renderDrawer(); if ($('note')) $('note').value = note;
  try {
    const items = L.map(l => ({ pid: l.p.id, name: l.p.name, price: Number(l.p.price) || 0, qty: l.q }));
    const ref = doc(collection(db, 'orders')), b = writeBatch(db);
    // shortcut: az árat és a készletet a böngésző küldi; mivel a vendég a szalonban fizet, Bendi a valós árat kéri el. Online fizetésnél ezt szerveren kell ellenőrizni.
    const data = { uid: user.uid, name: profile?.name || user.displayName || user.email.split('@')[0], email: user.email, phone: profile?.phone || '',
      items, total: items.reduce((s, i) => s + i.price * i.qty, 0), note, status: 'new', notified: false, mailed: true, created: serverTimestamp(), createdMs: Date.now() };
    b.set(ref, data); await stockMove(b, items, -1, ref.id); await b.commit(); ping();
    lastOrder = { id: ref.id, ...data }; cart = {}; saveCart(); sending = false; step = 'done';
    await loadProducts(); await loadOrders(); renderDrawer(); renderGrid(); renderOrders(); renderCart();
  } catch (e) {
    if (e.code !== 'stock') console.error(e);
    sending = false;
    // közben valaki más elvitte a készletet: frissítjük, a kosár a maradékra csökken
    const out = e.code === 'stock' || e.code === 'permission-denied';
    if (out) {
      await loadProducts().catch(() => {}); saveCart(); renderGrid(); renderCart(); step = 'cart'; renderDrawer();
      toast(e.code === 'stock' ? `Közben elfogyott: ${e.name}${e.left > 0 ? ` (már csak ${e.left} db)` : ''}. Frissítettem a kosarat.` : 'Közben változott a készlet. Frissítettem a kosarat.');
      return;
    }
    renderDrawer(); if ($('note')) $('note').value = note;
    const er = $('o-err'); if (er) er.textContent = 'A rendelés nem sikerült. Próbáld újra, vagy hívd fel Bendit.';
  }
}
async function cancelOrder(id){
  if (!confirm(`Lemondod a(z) ${orderNo(id)} rendelést?`)) return;
  try { const b = writeBatch(db), o = orders.find(x => x.id === id); b.update(doc(db, 'orders', id), { status: 'cancelled', cancelledBy: 'guest' }); if (o) await stockMove(b, o.items, 1, id); await b.commit(); ping(); await loadProducts(); await loadOrders(); renderGrid(); renderOrders(); toast('Lemondtad a rendelést.'); }
  catch (e) { console.error(e); toast('Nem sikerült lemondani. Hívd fel Bendit.'); }
}

/* ---------- események ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-open],[data-act],[data-tab],[data-ocancel],[data-cat],[data-pq],[data-cq],[data-rm]'); if (!t) return;
  const d = t.dataset;
  if (d.add) add(d.add);
  else if (d.open) { if ($('drawer').open) closeCart(); openProduct(d.open); }
  else if (d.cat !== undefined) { f.cat = d.cat; document.querySelectorAll('.chip-f').forEach(c => c.classList.toggle('on', c.dataset.cat === f.cat)); renderGrid(); }
  else if (d.pq) { pdQty += Number(d.pq); renderPd(); }
  else if (d.cq) setQty(d.cq, (cart[d.cq] || 0) + Number(d.d));
  else if (d.rm) setQty(d.rm, 0);
  else if (d.tab) { authTab = d.tab; renderDrawer(); }
  else if (d.ocancel) cancelOrder(d.ocancel);
  else if (d.act === 'pdadd') { add(pdId, pdQty); $('pd').close(); }
  else if (d.act === 'pdclose') $('pd').close();
  else if (d.act === 'cart') openCart();
  else if (d.act === 'close') closeCart();
  else if (d.act === 'checkout') { step = 'checkout'; renderDrawer(); }
  else if (d.act === 'back') { step = 'cart'; renderDrawer(); }
  else if (d.act === 'order') placeOrder();
  else if (d.act === 'logout') signOut(auth);
  else if (d.act === 'reset') resetPassword();
});
// a háttérre kattintva bezárul
['pd', 'drawer'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).close(); }));
$('pd').addEventListener('close', () => history.replaceState(null, '', location.pathname));
$('drawer').addEventListener('close', () => { if (step === 'done') step = 'cart'; renderCart(); });
document.addEventListener('input', e => { if (e.target.id === 'q') { f.q = e.target.value; renderGrid(); } });
document.addEventListener('change', e => { if (e.target.id === 'sort') { f.sort = e.target.value; renderGrid(); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'auth-form') return; e.preventDefault();
  const err = $('auth-err'); err.textContent = '';
  try { const p = await submitAuth(authTab, Object.fromEntries(new FormData(e.target)), x => regProfile = x); if (p) { profile = p; user = auth.currentUser || user; $('drIn').dataset.step = ''; renderDrawer(); } }
  catch (x) { regProfile = null; err.textContent = x.msg || authError(x); }
});

/* ---------- indulás ---------- */
S = await loadPublic();
mountAccount($('am'));
async function loadProducts(){
  const s = await getDocs(collection(db, 'products'));
  products = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.visible !== false).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  for (const id of Object.keys(cart)) { if (!P(id)) delete cart[id]; else if (cart[id] > left(P(id))) cart[id] = left(P(id)); if (cart[id] <= 0) delete cart[id]; }  // eltűnt / elfogyott termék ne maradjon a kosárban
}
if (S.shopEnabled) { try { await loadProducts(); } catch (e) { console.error(e); } }
render();
onAuthStateChanged(auth, async u => {
  user = u; profile = u ? await loadProfile(u, regProfile) : null; isAdmin = false;
  if (u) { try { isAdmin = (await getDoc(doc(db, 'admins', u.uid))).exists(); } catch (e) {} }
  if (isAdmin && !S.shopEnabled && !products.length) { try { await loadProducts(); built = false; } catch (e) { console.error(e); } }
  try { await loadOrders(); } catch (e) { console.error(e); }
  if ($('drIn').dataset.step === 'checkout') $('drIn').dataset.step = '';
  render(); if ($('drawer').open) renderDrawer();
  const m = location.hash.match(/^#p-(.+)$/); if (m && P(m[1]) && !$('pd').open) openProduct(m[1]);
});
// a fejléc fiók menüjében belépett, regisztrált vagy lemondott valamit
document.addEventListener('bendi:changed', async () => {
  if (user) profile = await loadProfile(user, regProfile);
  try { await loadProducts(); await loadOrders(); } catch (e) { console.error(e); }
  renderGrid(); renderOrders(); renderCart(); if ($('drawer').open) renderDrawer();
});
</script>
</body>
</html>
