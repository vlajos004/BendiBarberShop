<style>
/* Admin: a weboldal sötét stílusában (Bricolage + Manrope, piros kiemelés). A régi változónevek a sorok közti stílusok miatt maradnak. */
:root{--text:var(--ink);--cream:var(--bg);--bad:#ff6b6f;--brass:var(--red);--sans:var(--body)}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.wrap{width:min(960px,100% - 32px)}
.top{position:sticky;top:0;z-index:30;background:rgba(5,5,5,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.top h1{flex:1;display:flex;align-items:center;gap:10px;font:800 1.45rem var(--display);letter-spacing:-.02em}
.top h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.top h1 small{font:800 .66rem var(--body);letter-spacing:.14em;color:var(--red);background:var(--red-soft);padding:4px 8px;border-radius:6px;text-transform:uppercase}
.atabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;border:1px solid transparent;background:none;height:36px;padding:0 14px;border-radius:99px;font:700 .9rem var(--body);color:var(--muted);cursor:pointer;transition:color .2s,background .2s,border-color .2s}
.atabs button:hover{color:var(--ink)}
.atabs button.on{color:var(--ink);background:var(--surface-2);border-color:var(--line-2)}
.atabs .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:.7rem;margin-left:6px;padding:0 6px}
main{padding:24px 0}
#view > *{animation:rise .4s var(--ease) backwards}
#view > :nth-child(2){animation-delay:.04s}#view > :nth-child(3){animation-delay:.08s}#view > :nth-child(4){animation-delay:.12s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.card h3{font:800 1.15rem var(--display);margin-bottom:6px}
.muted{color:var(--muted);font-size:.92rem}
.muted a{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1;min-width:110px}
.btn-gold{background:var(--red);color:#fff}.btn-gold:hover:not(:disabled){background:var(--red-2)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover:not(:disabled){filter:brightness(1.1)}
.btn-bad{background:transparent;color:#ff6b6f;border-color:rgba(229,72,77,.5)}.btn-bad:hover:not(:disabled){background:var(--red-soft);border-color:var(--red)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}.btn-ghost:hover:not(:disabled){border-color:var(--ink)}
.btn-dark{background:var(--ink);color:#000}
.btn[disabled],.btn:disabled{background:transparent;color:var(--muted-2);border-color:var(--line);box-shadow:none}
.card a{color:var(--ink)}
.field textarea{min-height:200px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem;margin-top:12px}
.kv span:nth-child(odd){color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 10px;border:1px dashed var(--line-2);border-radius:16px}
h2.sec{font:800 1.35rem var(--display);margin:28px 0 12px}
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:560px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head strong{font:800 1.2rem var(--display);text-transform:capitalize}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer;font-size:18px}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-align:center;color:var(--muted-2);padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);font:700 .95rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.cal button:hover{border-color:var(--line-2)}
.cal button.today{color:var(--red)}
.cal button.on{background:var(--ink);color:#000}
.cal button.past{color:#4a4a50}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--red)}
.dots i.p{background:var(--warn)}
.dots i.k{background:#6b6b72}
.ag{display:flex;gap:16px;align-items:flex-start}
.ag .tm{min-width:64px;border-right:2px solid var(--red);padding-right:12px}
.ag .tm b{display:block;font:800 1.15rem var(--display);font-variant-numeric:tabular-nums}
.ag .tm span{font-size:.78rem;color:var(--muted)}
.ag.block .tm{border-color:#6b6b72}
.ag.faded{opacity:.5}
.ag .body{flex:1;min-width:0}
.ag .row .btn{flex:none}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch b{font-weight:700}
.switch input{width:48px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line-2);border-radius:14px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch input:checked{background:var(--red)}
.switch input:checked::after{transform:translateX(20px)}
.hrow{display:grid;grid-template-columns:96px 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0}
.hrow input[type=time]{min-height:42px;padding:8px;font:inherit;border-radius:10px;border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);color-scheme:dark}
.hrow input:disabled{opacity:.35}
.field input[type=date],.field input[type=time]{color-scheme:dark}
.check{color:var(--ink)}
.chips label.check{background:transparent!important;border:1.5px solid var(--line-2)!important;color:var(--ink)!important}
.login{max-width:420px;margin:14vh auto 0}
.login h1{font:800 2.6rem var(--display);display:flex;align-items:center;gap:12px}
.login h1::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red)}
pre#pv{background:var(--bg)!important;border:1px solid var(--line);color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),border-color .2s}
.gitem:hover{transform:translateY(-3px);border-color:var(--line-2)}
.gitem .im{aspect-ratio:4/5;background:var(--surface-2) center/cover no-repeat}
.gitem .gb{padding:10px;display:grid;gap:8px}
.gitem input{width:100%;font:inherit;font-size:.88rem;padding:8px 10px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--ink)}
.gitem input:focus{outline:none;border-color:var(--red)}
.gitem .row{margin-top:0;gap:6px}.gitem .row .btn{min-width:0;flex:1;padding:0 8px}
.upl{display:inline-flex;cursor:pointer}
.pitem{display:flex;gap:14px;align-items:center}
.pitem .im{width:72px;height:72px;border-radius:12px;background:var(--surface-2) center/cover no-repeat;flex:none}
.heroimg{aspect-ratio:16/7;border-radius:14px;background:var(--bg) center/cover no-repeat;margin:12px 0;display:grid;place-items:center;color:var(--muted-2);font-size:.9rem;border:1px dashed var(--line-2)}
</style>
</head>
<body>
<div id="app"><div class="empty">Betöltés…</div></div>

<script type="module">
import { auth, db, DEFAULT_PUBLIC, DEFAULT_PRIVATE, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, writeBatch, serverTimestamp,
  today, parse, toStr, addDays, mins, hhmm, fmtLong, fmtShort, fmtDur, bLabel, esc, WEEKDAYS, randToken, STATUS, CONFIRM, toast, authError, ping,
  compressImage, fmtFt } from './common.js?v=9';

const $ = id => document.getElementById(id);
let user = null, PUB = null, PRIV = null, tab = 'req', pending = [], monthB = [], monthBusy = [], blocks = [];
let calMonth = today().slice(0, 8) + '01', selDay = today(), showNew = false;
let gal = [], prods = [], orders = [], editProd = null, heroImg = null, busyUp = false;
const GAL_MAX = 6;  // a weboldal elrendezése 1–6 képre készült
const ORDER = { new: ['Beérkezett', 'warn'], ready: ['Átvehető', 'ok'], done: ['Átvéve', 'muted'], cancelled: ['Lemondva', 'muted'] };

/* ---------- belépés ---------- */
function loginView(msg = ''){
  $('app').innerHTML = `<div class="wrap"><div class="card login"><h1>Bendi</h1><p class="muted">Lépj be a foglalások kezeléséhez.</p>
    <form id="lf"><label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Jelszó</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-gold" style="width:100%;margin-top:18px">Belépés</button>
    <p style="text-align:center;margin:12px 0 0"><button type="button" class="btn btn-line" id="reset">Elfelejtett jelszó</button></p>
    <p class="err" id="lerr">${esc(msg)}</p></form>
    <p class="muted" style="margin-top:18px">Az admin fiókot egyszer, a telepítési útmutató szerint kell beállítani.</p><p style="margin-top:10px"><a href="index.html" style="color:var(--muted)">← Vissza a weboldalra</a></p></div></div>`;
  $('lf').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try { await signInWithEmailAndPassword(auth, f.email.trim(), f.password); } catch (x) { $('lerr').textContent = authError(x); } };
  $('reset').onclick = async () => { const em = document.querySelector('#lf [name=email]').value.trim(); if (!em) { $('lerr').textContent = 'Írd be az e-mail-címed.'; return; }
    try { await sendPasswordResetEmail(auth, em); toast('Jelszó-visszaállító e-mail elküldve.'); } catch (x) { $('lerr').textContent = authError(x); } };
}

/* ---------- adatok ---------- */
async function loadSettings(){
  const [a, b] = await Promise.all([getDoc(doc(db, 'settings', 'public')), getDoc(doc(db, 'settings', 'private'))]);
  PUB = Object.assign({}, DEFAULT_PUBLIC, a.exists() ? a.data() : {});
  PRIV = Object.assign({}, DEFAULT_PRIVATE, b.exists() ? b.data() : {});
  // első indításkor létrehozzuk az alapbeállításokat, hogy a weboldal és az e-mail-szkript lássa őket
  if (!a.exists()) await setDoc(doc(db, 'settings', 'public'), PUB);
  if (!b.exists()) await setDoc(doc(db, 'settings', 'private'), { ...PRIV, notifyEmail: PRIV.notifyEmail || user.email });
  if (!b.exists()) PRIV.notifyEmail = PRIV.notifyEmail || user.email;
}
async function loadPending(){
  const s = await getDocs(query(collection(db, 'bookings'), where('status', '==', 'pending')));
  pending = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byTime);
}
async function loadMonth(){
  const d0 = parse(calMonth), from = calMonth, to = toStr(new Date(d0.getFullYear(), d0.getMonth() + 1, 0));
  const [b, k] = await Promise.all([
    getDocs(query(collection(db, 'bookings'), where('date', '>=', from), where('date', '<=', to))),
    getDocs(query(collection(db, 'busy'), where('date', '>=', from), where('date', '<=', to)))]);
  monthB = b.docs.map(d => ({ id: d.id, ...d.data() }));
  monthBusy = k.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function loadBlocks(){
  const s = await getDocs(query(collection(db, 'busy'), where('date', '>=', today())));
  blocks = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.kind === 'block').sort(byTime);
}
const byTime = (a, b) => (a.date + a.start).localeCompare(b.date + b.start);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
async function loadGallery(){ const s = await getDocs(collection(db, 'gallery')); gal = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byOrder); }
async function loadProducts(){ const s = await getDocs(collection(db, 'products')); prods = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byOrder); }
async function loadOrders(){
  const [a, b] = await Promise.all(['new', 'ready'].map(st => getDocs(query(collection(db, 'orders'), where('status', '==', st)))));
  orders = [...a.docs, ...b.docs].map(d => ({ id: d.id, ...d.data() })).sort((x, y) => (x.createdMs || 0) - (y.createdMs || 0));
}
async function loadHero(){ const h = await getDoc(doc(db, 'settings', 'hero')); heroImg = h.exists() ? h.data().img || null : null; }
const badge = ([t, c]) => `<span class="badge b-${c}">${t}</span>`;
const bBadges = b => badge(STATUS[b.status] || ['?', 'muted']) + (b.status === 'accepted' && b.guestConfirm ? ' ' + badge(CONFIRM[b.guestConfirm]) : (b.status === 'accepted' && b.reminded && PRIV.reminderConfirm ? ' ' + badge(['Nem válaszolt még', 'muted']) : ''));

/* ---------- felület ---------- */
function shell(){
  $('app').innerHTML = `<div class="top"><div class="wrap"><h1>Bendi<small>Admin</small></h1>
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank">Weboldal</a><button class="btn btn-ghost btn-sm" id="out">Kilépés</button></div>
      <div class="wrap atabs" id="tabs"></div></div><main class="wrap" id="view"></main>`;
  $('out').onclick = () => signOut(auth);
}
function renderTabs(){
  const t = [['req', 'Kérések', pending.length], ['cal', 'Naptár'], ['block', 'Zárolás'], ['gal', 'Munkáim'], ['shop', 'Webshop', orders.filter(o => o.status === 'new').length], ['set', 'Beállítások']];
  $('tabs').innerHTML = t.map(([k, n, c]) => `<button class="${tab === k ? 'on' : ''}" data-tab="${k}">${n}${c ? `<span class="cnt">${c}</span>` : ''}</button>`).join('');
}
async function render(){
  renderTabs();
  const v = $('view');
  if (tab === 'req') v.innerHTML = vReq();
  if (tab === 'cal') { await loadMonth(); v.innerHTML = vCal(); }
  if (tab === 'block') { await loadBlocks(); v.innerHTML = vBlock(); rangeKey = ''; blLoad(); }
  if (tab === 'gal') { await loadGallery(); v.innerHTML = vGal(); }
  if (tab === 'shop') { await Promise.all([loadProducts(), loadOrders()]); renderTabs(); v.innerHTML = vShop(); }
  if (tab === 'set') { await loadHero(); v.innerHTML = vSet(); bindSet(); }
}

function bookingCard(b, actions){
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>${esc(b.name || '(név nélkül)')}</h3>${bBadges(b)}</div>
    <div class="kv"><span>Időpont</span><span><b>${esc(fmtLong(b.date))}, ${esc(b.start)}–${esc(b.end)}</b></span>
    <span>Időtartam</span><span>${esc(bLabel(b))}</span>
    ${b.phone ? `<span>Telefon</span><span><a href="tel:${esc(b.phone.replace(/\s/g, ''))}">${esc(b.phone)}</a></span>` : ''}
    ${b.email ? `<span>E-mail</span><span><a href="mailto:${esc(b.email)}">${esc(b.email)}</a></span>` : ''}</div>
    <div class="row">${actions}</div></div>`;
}
function vReq(){
  if (!pending.length) return '<div class="empty">Nincs jóváhagyásra váró foglalás. 🎉</div>';
  return `<p class="muted">A jóváhagyásra váró időpontok a weboldalon már foglaltként látszanak.</p>` + pending.map(b => bookingCard(b,
    `<button class="btn btn-ok" data-acc="${b.id}">Elfogadom</button><button class="btn btn-bad" data-rej="${b.id}">Elutasítom</button><button class="btn btn-ghost btn-sm" data-ban="${b.id}" title="Elutasítja és letiltja a felhasználót">Letiltás</button>`)).join('');
}

function vCal(){
  const t = today(), d0 = parse(calMonth), y = d0.getFullYear(), m = d0.getMonth();
  let h = `<div class="calbox"><div class="cal-head"><button class="icon-btn" data-mon="-1" aria-label="Előző hónap">‹</button><strong>${d0.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long' })}</strong><button class="icon-btn" data-mon="1" aria-label="Következő hónap">›</button></div><div class="cal">`;
  h += ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < (d0.getDay() + 6) % 7; i++) h += '<div></div>';
  for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++){
    const ds = toStr(new Date(y, m, d));
    const bs = monthB.filter(b => b.date === ds && ['pending', 'accepted'].includes(b.status) && b.guestConfirm !== 'no');
    const blk = monthBusy.some(x => x.date === ds && x.kind === 'block');
    const dots = bs.slice(0, 4).map(b => `<i class="${b.status === 'pending' ? 'p' : ''}"></i>`).join('') + (blk ? '<i class="k"></i>' : '');
    h += `<button class="${ds === t ? 'today' : ''} ${ds === selDay ? 'on' : ''} ${ds < t ? 'past' : ''}" data-day="${ds}" aria-label="${fmtLong(ds)}, ${bs.length} foglalás">${d}<span class="dots">${dots}</span></button>`;
  }
  h += `</div></div><p class="muted" style="margin:8px 4px 0">Pötty: piros = elfogadott, narancs = jóváhagyásra vár, szürke = zárolás.</p>`;
  const items = [...monthB.filter(b => b.date === selDay).map(b => ({ t: 'b', ...b })), ...monthBusy.filter(x => x.date === selDay && x.kind === 'block').map(x => ({ t: 'k', ...x }))].sort(byTime);
  h += `<h2 class="sec">${esc(fmtLong(selDay))}</h2>`;
  if (!items.length) h += '<div class="card muted">Erre a napra nincs foglalás.</div>';
  for (const it of items){
    if (it.t === 'k') { h += `<div class="card ag block"><div class="tm"><b>${it.start === '00:00' && it.end === '23:59' ? 'Egész' : it.start}</b><span>${it.start === '00:00' && it.end === '23:59' ? 'nap' : it.end + '-ig'}</span></div><div class="body"><b>Zárolva</b><div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-unblock="${it.id}">Feloldás</button></div></div></div>`; continue; }
    const live = ['pending', 'accepted'].includes(it.status) && it.guestConfirm !== 'no';
    const fut = it.date >= t;
    h += `<div class="card ag ${live ? '' : 'faded'}"><div class="tm"><b>${esc(it.start)}</b><span>${esc(it.end)}-ig</span></div><div class="body">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(it.name)}</b><span>${bBadges(it)}</span></div>
      <div class="muted">${esc(bLabel(it))}${it.phone ? ` · <a href="tel:${esc(it.phone.replace(/\s/g, ''))}">${esc(it.phone)}</a>` : ''}</div>
      <div class="row" style="margin-top:8px">${it.status === 'pending' ? `<button class="btn btn-ok btn-sm" data-acc="${it.id}">Elfogadom</button><button class="btn btn-bad btn-sm" data-rej="${it.id}">Elutasítom</button>` : ''}
      ${it.status === 'accepted' && fut && it.guestConfirm !== 'no' ? (it.email ? (it.remindNow ? '<span class="badge b-muted">Emlékeztető küldése folyamatban</span>' : `<button class="btn btn-gold btn-sm" data-remind="${it.id}">Emlékeztető küldése most</button>`) : '') + `<button class="btn btn-ghost btn-sm" data-acancel="${it.id}">Lemondom</button>` : ''}</div></div></div>`;
  }
  h += showNew ? newForm() : `<button class="btn btn-dark" data-act="new" style="width:100%;margin-top:6px">+ Foglalás felvétele erre a napra</button>`;
  return h;
}
function newForm(){
  return `<div class="card"><h3>Új foglalás – ${esc(fmtShort(selDay))}</h3><p class="muted">Telefonos vagy személyes foglaláshoz. Azonnal elfogadottként kerül be.</p>
    <form id="nf"><label class="field"><span>Név</span><input name="name" required></label>
    <div class="grid2"><label class="field"><span>Telefon</span><input name="phone" type="tel"></label><label class="field"><span>E-mail (emlékeztetőhöz)</span><input name="email" type="email"></label></div>
    <div class="grid2"><label class="field"><span>Időtartam</span><select name="dur">${[15,30,45,60,75,90,120,150,180].map(v => `<option value="${v}" ${v === (PUB.durations[0] || 30) ? 'selected' : ''}>${fmtDur(v)}</option>`).join('')}</select></label>
    <label class="field"><span>Kezdés</span><input name="time" type="time" step="300" required></label></div>
    <div class="row"><button class="btn btn-gold">Mentés</button><button type="button" class="btn btn-ghost" data-act="cancelnew">Mégse</button></div></form></div>`;
}

function vGal(){
  return `<div class="card"><label class="switch" style="border:0;padding:0"><span><b>Munkáim látható a weboldalon</b><br><span class="muted">Kikapcsolva a rész és a menüpont is eltűnik, a képek megmaradnak.</span></span><input type="checkbox" id="galon" ${PUB.galleryEnabled !== false ? 'checked' : ''}></label></div>
    <div class="card"><h3>Munkáim</h3><p class="muted">Ezek a képek a weboldal „Munkáim” részében látszanak, ebben a sorrendben. Legfeljebb ${GAL_MAX} kép lehet, az elrendezés a darabszámhoz igazodik. Ha nincs kép, a rész nem jelenik meg. Feltöltéskor a képeket automatikusan lekicsinyítjük.</p>
    <div class="row">${gal.length >= GAL_MAX ? `<span class="muted">Megvan mind a ${GAL_MAX} kép. Újat akkor tölthetsz fel, ha egyet törölsz.</span>` : `<label class="btn btn-gold upl">${busyUp ? 'Feltöltés…' : '+ Képek feltöltése'}<input type="file" accept="image/*" multiple id="galup" hidden ${busyUp ? 'disabled' : ''}></label><span class="muted">${gal.length} / ${GAL_MAX}</span>`}</div></div>
    ${gal.length ? `<div class="ggrid">${gal.map((g, i) => `<div class="gitem"><div class="im" style="background-image:url('${g.img}')"></div><div class="gb">
      <input data-cap="${g.id}" value="${esc(g.caption || '')}" placeholder="Felirat (nem kötelező)" maxlength="80">
      <div class="row"><button class="btn btn-ghost btn-sm" data-gmove="${g.id}" data-d="-1" ${i ? '' : 'disabled'} aria-label="Előrébb">↑</button><button class="btn btn-ghost btn-sm" data-gmove="${g.id}" data-d="1" ${i < gal.length - 1 ? '' : 'disabled'} aria-label="Hátrébb">↓</button><button class="btn btn-bad btn-sm" data-gdel="${g.id}">Törlés</button></div></div></div>`).join('')}</div>`
      : '<div class="card muted">Még nincs feltöltött kép.</div>'}`;
}
function vShop(){
  const o = orders;
  let h = `<div class="card"><label class="switch" style="border:0;padding:0"><span><b>Webshop látható a weboldalon</b><br><span class="muted">Kikapcsolva a vendégek nem látják, de te belépve megnézheted az előnézetet.</span></span><input type="checkbox" id="shopon" ${PUB.shopEnabled ? 'checked' : ''}></label>
    <div class="row"><a class="btn btn-ghost btn-sm" href="shop.html" target="_blank" style="flex:none">Webshop előnézete</a></div></div>
    <h2 class="sec">Rendelések</h2>`;
  h += o.length ? o.map(x => `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3>${esc(x.name || '')}</h3><span class="badge b-${ORDER[x.status][1]}">${ORDER[x.status][0]}</span></div>
      <div class="kv">${x.items.map(i => `<span>${i.qty} ×</span><span>${esc(i.name)} – ${fmtFt(i.price)}</span>`).join('')}<span>Összesen</span><span><b>${fmtFt(x.total)}</b></span>
      ${x.phone ? `<span>Telefon</span><span><a href="tel:${esc(x.phone.replace(/\s/g, ''))}">${esc(x.phone)}</a></span>` : ''}${x.email ? `<span>E-mail</span><span><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></span>` : ''}
      ${x.note ? `<span>Megjegyzés</span><span>${esc(x.note)}</span>` : ''}</div>
      <div class="row">${x.status === 'new' ? `<button class="btn btn-ok" data-ost="${x.id}" data-s="ready">Átvehető (e-mailt kap)</button>` : `<button class="btn btn-ok" data-ost="${x.id}" data-s="done">Átvette, kifizette</button>`}<button class="btn btn-bad" data-ost="${x.id}" data-s="cancelled">Lemondom</button></div></div>`).join('')
    : '<div class="card muted">Nincs nyitott rendelés.</div>';
  h += `<h2 class="sec">Termékek</h2>${editProd ? prodForm() : '<button class="btn btn-dark" data-act="newprod" style="width:100%;margin-bottom:12px">+ Új termék</button>'}`;
  h += prods.length ? prods.map((p, i) => `<div class="card pitem"><div class="im" style="${p.img ? `background-image:url('${p.img}')` : ''}"></div><div style="flex:1;min-width:0">
      <b>${esc(p.name)}</b> ${p.category ? `<span class="badge b-muted">${esc(p.category)}</span>` : ''} ${p.visible === false ? '<span class="badge b-muted">Rejtett</span>' : ''}<div class="muted">${fmtFt(p.price)} · ${p.stock == null || p.stock === '' ? 'korlátlan készlet' : p.stock + ' db készleten'}</div>

function bindSet(){
  document.querySelectorAll('[data-closed]').forEach(c => c.onchange = () => { const d = c.dataset.closed; document.querySelectorAll(`[name=h${d}a],[name=h${d}b]`).forEach(i => i.disabled = c.checked); });
  $('sf').onsubmit = saveSettings;
}
async function saveSettings(e){
  e.preventDefault();
  const f = e.target, v = n => f.elements[n].value.trim(), on = n => f.elements[n].checked;
  const hours = {};
  for (const d of [0,1,2,3,4,5,6]) {
    if (on('h' + d + 'x')) { hours[d] = null; continue; }
    const a = v('h' + d + 'a'), b = v('h' + d + 'b');
    if (!a || !b || mins(a) >= mins(b)) { toast(`${WEEKDAYS[d]}: a zárás legyen későbbi, mint a nyitás.`); return; }
    hours[d] = [a, b];
  }
  const durations = [15,30,45,60,75,90,120,150,180].filter(x => on('dur' + x));
  if (!durations.length) { toast('Legalább egy időtartamot jelölj be.'); return; }
  const pub = { ...PUB, address: v('address'), phone: v('phone'),
    publicEmail: v('publicEmail'), instagram: v('instagram').replace('@', ''), hours, durations, slotStep: Number(v('slotStep')),
    horizonDays: Math.max(1, Number(v('horizonDays')) || 14), maxActive: Math.max(1, Number(v('maxActive')) || 2), minNoticeHours: Math.max(0, Number(v('minNoticeHours')) || 0), requireApproval: on('requireApproval') };
  const priv = { ...PRIV, notifyEmail: v('notifyEmail'), reminderConfirm: on('reminderConfirm'), reminderSubject: v('reminderSubject') || DEFAULT_PRIVATE.reminderSubject, reminderBody: f.elements.reminderBody.value.trim() || DEFAULT_PRIVATE.reminderBody };
  try { await Promise.all([setDoc(doc(db, 'settings', 'public'), pub), setDoc(doc(db, 'settings', 'private'), priv)]); PUB = pub; PRIV = priv; toast('Beállítások elmentve.'); }
  catch (x) { console.error(x); toast('Nem sikerült menteni.'); }
}
function preview(){
  const f = $('sf'), body = f.elements.reminderBody.value, link = f.elements.reminderConfirm.checked ? 'https://…/confirm.html?…' : null;
  const vals = { nev: 'Kovács Péter', datum: fmtLong(addDays(today(), 1)), ido: '14:00', idotartam: fmtDur(PUB.durations[0] || 45), mikor: 'holnap (' + fmtLong(addDays(today(), 1)) + ')', link };
  vals.szolgaltatas = vals.idotartam;
  const fill = s => s.split('\n').filter(l => link || !l.includes('{link}')).join('\n').replace(/( ?)\{(\w+)\}/g, (m, sp, k) => { const low = k[0].toLowerCase() + k.slice(1); let v = vals[k] ?? vals[low]; if (v == null) return m; v = String(v); if (k !== low) v = v[0].toUpperCase() + v.slice(1); return v === '' ? '' : sp + v; });
  const pv = $('pv'); pv.style.display = 'block'; pv.textContent = 'Tárgy: ' + fill(f.elements.reminderSubject.value) + '\n\n' + fill(body);
}

/* ---------- műveletek ---------- */
async function accept(id){
  try { await updateDoc(doc(db, 'bookings', id), { status: 'accepted', decisionMailed: false }); ping(); toast('Elfogadva. A vendég e-mailt kap.'); await refresh(); } catch (e) { console.error(e); toast('Hiba történt.'); }
}
async function reject(id, ban = false){
  const b = pending.find(x => x.id === id) || monthB.find(x => x.id === id);
  if (ban && !confirm(`Elutasítod, és letiltod ${b?.name || 'a felhasználót'}? Többé nem tud foglalni.`)) return;
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'bookings', id), { status: 'rejected', decisionMailed: ban });  // tiltottnak nem küldünk levelet
    batch.delete(doc(db, 'busy', id));
    if (ban && b?.uid && b.uid !== 'admin') batch.set(doc(db, 'banned', b.uid), { name: b.name || '', email: b.email || '', at: serverTimestamp() });
    await batch.commit(); ping(); toast(ban ? 'Elutasítva és letiltva.' : 'Elutasítva. A vendég e-mailt kap.'); await refresh();
  } catch (e) { console.error(e); toast('Hiba történt.'); }
}
async function adminCancel(id){
  const b = monthB.find(x => x.id === id); if (!confirm(`Lemondod ${b.name} időpontját (${fmtShort(b.date)} ${b.start})? A vendég e-mailt kap róla.`)) return;
  const batch = writeBatch(db);
  batch.update(doc(db, 'bookings', id), { status: 'cancelled', cancelledBy: 'admin', decisionMailed: false });
  batch.delete(doc(db, 'busy', id));
  await batch.commit(); ping(); toast('Lemondva.'); await refresh();
}
async function addBooking(e){
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), dur = Number(f.dur), end = hhmm(mins(f.time) + dur);
  const clash = monthBusy.find(x => x.date === selDay && mins(x.start) < mins(end) && mins(f.time) < mins(x.end));
  if (clash && !confirm(`Ütközik egy ${clash.kind === 'block' ? 'zárolással' : 'foglalással'} (${clash.start}–${clash.end}). Mégis mented?`)) return;
  const ref = doc(collection(db, 'bookings')), batch = writeBatch(db);
  batch.set(ref, { uid: 'admin', name: f.name.trim(), email: f.email.trim(), phone: f.phone.trim(), dur,
    date: selDay, start: f.time, end, status: 'accepted', guestConfirm: null, token: randToken(), notified: true, reminded: false, decisionMailed: true, created: serverTimestamp() });
  batch.set(doc(db, 'busy', ref.id), { date: selDay, start: f.time, end, kind: 'booking' });
  try { await batch.commit(); showNew = false; toast('Foglalás felvéve.'); await refresh(); } catch (x) { console.error(x); toast('Nem sikerült menteni.'); }
}
async function addBlock(e){
  e.preventDefault();
  const r = blRange(); if (!r || r.err) { toast('Az utolsó nap nem lehet az első előtt.'); return; }
  const days = r.days.filter(d => blDay(d).on); if (!days.length) { toast('Jelölj ki legalább egy napot.'); return; }
  const hit = days.reduce((n, d) => n + blHits(d).length, 0);
  if (hit && !confirm(`${hit} foglalás esik a zárolásba, ezeket nem mondja le. Mégis zárolod?`)) return;
  const batch = writeBatch(db);
  days.forEach(d => { const x = blDay(d); batch.set(doc(collection(db, 'busy')), { date: d, start: x.whole ? '00:00' : hhmm(x.a), end: x.whole ? '23:59' : hhmm(x.b), kind: 'block' }); });
  try { await batch.commit(); toast(`Zárolva (${days.length} nap).`); blDays = {}; await render(); } catch (x) { console.error(x); toast('Nem sikerült menteni.'); }
}
// Zárolás szerkesztő: minden nap külön sor (be/ki, egész nap vagy idősáv a sávon húzva). A skálát a nyitvatartás leghosszabb napja adja.
let rangeBusy = [], rangeKey = '', blDays = {}, blMulti = false;
const blAll = { whole: true, a: 720, b: 780 };
const BL_MAX = 31;
function blScale(){ const hs = Object.values(PUB.hours || {}).filter(Boolean); return hs.length ? [Math.min(...hs.map(h => mins(h[0]))), Math.max(...hs.map(h => mins(h[1])))] : [480, 1200]; }
const blPc = m => { const [S0, S1] = blScale(); return (Math.max(S0, Math.min(S1, m)) - S0) / (S1 - S0) * 100; };
const blOpen = d => PUB.hours[String(parse(d).getDay())];
function blRange(){
  const e = $('bf')?.elements; if (!e) return null;
  const from = e.from.value, to = blMulti ? e.to.value : from; if (!from || !to || to < from) return { err: true };
  const days = []; for (let d = from; d <= to && days.length < BL_MAX; d = addDays(d, 1)) days.push(d);
  return { from, to, days, more: addDays(from, BL_MAX) <= to };
}
function blDay(d){ return blDays[d] || (blDays[d] = { on: !!blOpen(d), whole: blAll.whole, a: blAll.a, b: blAll.b }); }
function blHits(d){ const x = blDay(d); return x.on ? rangeBusy.filter(y => y.date === d && y.kind === 'booking' && (x.whole || (mins(y.start) < x.b && x.a < mins(y.end)))) : []; }
async function blLoad(){
  const r = blRange();
  if (r && !r.err) {
    const key = r.from + '|' + r.days[r.days.length - 1];
    if (key !== rangeKey) { rangeKey = key;
      try { const q = await getDocs(query(collection(db, 'busy'), where('date', '>=', r.from), where('date', '<=', r.days[r.days.length - 1]))); if (rangeKey !== key) return; rangeBusy = q.docs.map(d => d.data()); }
      catch (e) { console.error(e); rangeBusy = []; } }
  }
  blDraw();
}
const blSeg = (attr, whole) => `<div class="bl-seg" role="group" aria-label="Zárolás módja"><button type="button" ${attr} data-v="1" class="${whole ? 'on' : ''}">Egész nap</button><button type="button" ${attr} data-v="0" class="${whole ? '' : 'on'}">Idősáv</button></div>`;
function blSlider(inner, attrA, attrB, a, b, label){
  const [S0, S1] = blScale();
  return `<div class="bl-bar"><div class="bl-in">${inner}<i class="nw"></i></div>
    <input type="range" ${attrA} min="${S0}" max="${S1}" step="15" value="${a}" aria-label="${label} kezdete"><input type="range" ${attrB} min="${S0}" max="${S1}" step="15" value="${b}" aria-label="${label} vége"></div>`;
}
function blDraw(){
  const el = $('blArea'); if (!el) return;
  const r = blRange(); if (!r) return;
  if (r.err) { el.innerHTML = '<p class="bl-warn">Az utolsó nap nem lehet az első előtt.</p>'; blSummary(); return; }
  if (!blMulti) blDay(r.days[0]).on = true;  // egy napnál nincs kihagyás
  el.classList.toggle('bl-single', !blMulti);
  const [S0, S1] = blScale(), ticks = [S0]; for (let m = S0 + 120; S1 - m >= 90; m += 120) ticks.push(m); ticks.push(S1);
  const seg = (x0, x1, c, t) => `<i class="${c}" style="left:${blPc(x0)}%;width:${Math.max(0, blPc(x1) - blPc(x0))}%"${t ? ` title="${t}"` : ''}></i>`;
  const hours = `<div class="dl-hours">${ticks.map(m => `<span style="left:${blPc(m)}%">${hhmm(m).replace(/^0/, '')}</span>`).join('')}</div>`;
  const rows = r.days.map(d => {
    const h = blOpen(d), x = blDay(d), p = parse(d);
    const inner = (h ? seg(S0, mins(h[0]), 'cl') + seg(mins(h[1]), S1, 'cl') : seg(S0, S1, 'cl'))
      + rangeBusy.filter(y => y.date === d).map(y => seg(mins(y.start), mins(y.end), y.kind === 'block' ? 'bk' : 'bo', (y.kind === 'block' ? 'Már zárolva ' : 'Foglalás ') + y.start + '–' + y.end)).join('');
    return `<div class="bl-row" data-d="${d}">
      <label class="bl-on"><input type="checkbox" data-blon="${d}" ${x.on ? 'checked' : ''}><span><b>${p.toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' })}</b> ${WEEKDAYS[p.getDay()].toLowerCase()}</span></label>
      ${blSeg(`data-blwhole="${d}"`, x.whole)}
      ${blSlider(inner, `data-bla="${d}"`, `data-blb="${d}"`, x.a, x.b, p.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric' }))}
      <span class="bl-n"><b class="bl-t"></b><small></small></span></div>`;
  }).join('');
  el.innerHTML = (r.days.length > 1 ? `<div class="bl-all"><div class="bl-row bl-row-all"><span class="bl-on"><span><b>Mind a ${r.days.length} napra</b> egyszerre</span></span>${blSeg('data-blall', blAll.whole)}${blSlider('', 'id="blA"', 'id="blB"', blAll.a, blAll.b, 'Minden nap')}<span class="bl-n"><b class="bl-t" id="blAllT"></b></span></div><p class="muted bl-all-h">Ez az összes napot átállítja, utána soronként is módosíthatod.</p></div>` : '')
    + `<div class="bl-head"><b>${blMulti ? 'Napok' : 'Mikor zárolsz?'}</b><span class="bl-leg"><span><i class="bo"></i>foglalás</span><span><i class="bk"></i>már zárolt</span><span><i class="nw"></i>új zárolás</span><span><i class="cl"></i>zárva</span></span></div>
    <div class="bl-list"><div class="bl-row bl-ticks"><span></span><span></span>${hours}<span></span></div>${rows}</div>
    ${r.more ? `<p class="muted" style="margin:8px 0 0">Egyszerre legfeljebb ${BL_MAX} nap zárolható, a többit külön add hozzá.</p>` : ''}
    <p class="bl-warn" id="blWarn" hidden></p>`;
  r.days.forEach(blPatch); blPatchAll(); blSummary();
}
function blPaint(row, x, on){
  row.querySelector('.bl-bar').classList.toggle('whole', x.whole);
  row.querySelectorAll('.bl-seg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === x.whole));
  const nw = row.querySelector('i.nw'); nw.hidden = !on;
  nw.style.left = (x.whole ? 0 : blPc(x.a)) + '%'; nw.style.width = (x.whole ? 100 : blPc(x.b) - blPc(x.a)) + '%';
  const [ia, ib] = row.querySelectorAll('input[type=range]'); ia.value = x.a; ib.value = x.b;
}
function blPatch(d){
  const row = document.querySelector(`.bl-row[data-d="${d}"]`); if (!row) return;
  const x = blDay(d), hits = blHits(d);
  row.classList.toggle('off', !x.on); row.classList.toggle('hit', hits.length > 0);
  blPaint(row, x, x.on);
  row.querySelector('.bl-t').textContent = !x.on ? 'kihagyva' : x.whole ? 'egész nap' : hhmm(x.a) + '–' + hhmm(x.b);
  row.querySelector('.bl-n small').textContent = hits.length ? hits.length + ' foglalás ütközik' : !blOpen(d) ? 'zárva van' : '';
}
function blPatchAll(){ const row = document.querySelector('.bl-row-all'); if (!row) return; blPaint(row, blAll, true); $('blAllT').textContent = blAll.whole ? 'egész nap' : hhmm(blAll.a) + '–' + hhmm(blAll.b); }
function blSummary(){
  const r = blRange(), go = $('blGo'); if (!go) return;
  const days = r && !r.err ? r.days.filter(d => blDay(d).on) : [], hit = days.reduce((n, d) => n + blHits(d).length, 0);
  go.disabled = !days.length; go.textContent = days.length ? `Zárolás · ${days.length} nap` : 'Zárolás';
  $('blSum').textContent = days.length ? '' : 'Nincs kijelölt nap.';
  const w = $('blWarn'); if (w) { w.hidden = !hit; w.textContent = `${hit} meglévő foglalás esik a zárolásba. Ezeket a zárolás nem mondja le, azt külön kell megtenned.`; }
}
// a sávok húzása, a módváltó gombok és a napok be/ki kapcsolása (újrarajzolás nélkül, hogy a húzás ne szakadjon meg)
function blMove(t, x){
  const isA = t.matches('#blA,[data-bla]'), row = t.closest('.bl-bar'), [ia, ib] = row.querySelectorAll('input[type=range]');
  let a = Number(ia.value), b = Number(ib.value);
  if (b - a < 15) { if (isA) a = b - 15; else b = a + 15; }
  x.a = a; x.b = b;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bla || t.dataset.blb) { const d = t.dataset.bla || t.dataset.blb; blMove(t, blDay(d)); blPatch(d); blSummary(); }
  else if (t.id === 'blA' || t.id === 'blB') { blMove(t, blAll); blRange().days.forEach(d => { const x = blDay(d); x.a = blAll.a; x.b = blAll.b; blPatch(d); }); blPatchAll(); blSummary(); }
});
// a sávok húzása egérrel / ujjal: a végük külön, a piros sáv a közepénél fogva egyben; kattintásra a közelebbi vég odaugrik
let blDrag = null;
function blApply(d){
  if (d) blPatch(d);
  else { blRange().days.forEach(k => { const x = blDay(k); x.whole = blAll.whole; x.a = blAll.a; x.b = blAll.b; blPatch(k); }); blPatchAll(); }
  blSummary();
}
function blDragMove(e){
  const g = blDrag; if (!g) return;
  const m = Math.max(g.S0, Math.min(g.S1, g.at(e.clientX))), x = g.x;
  if (g.mode === 'band') { x.a = Math.max(g.S0, Math.min(g.S1 - g.len, m - g.off)); x.b = x.a + g.len; }
  else if (g.mode === 'a') x.a = Math.min(m, x.b - 15);
  else x.b = Math.max(m, x.a + 15);
  blApply(g.d);
}
document.addEventListener('pointerdown', e => {
  const bar = e.target.closest('.bl-bar'); if (!bar || e.button) return;
  const row = bar.closest('.bl-row'); if (!row || row.classList.contains('off')) return;
  const d = row.dataset.d || null, x = d ? blDay(d) : blAll;
  const [S0, S1] = blScale(), r = bar.getBoundingClientRect();
  const at = cx => Math.round((S0 + (cx - r.left) / r.width * (S1 - S0)) / 15) * 15, px = v => r.left + (v - S0) / (S1 - S0) * r.width;
  const m = Math.max(S0, Math.min(S1, at(e.clientX)));
  const fresh = x.whole;  // egész napos sávba kattintva egy órás idősáv lesz belőle, amit rögtön lehet húzni
  if (fresh) { x.whole = false; x.a = Math.max(S0, Math.min(S1 - 60, m - 30)); x.b = x.a + 60; }
  const da = Math.abs(e.clientX - px(x.a)), db = Math.abs(e.clientX - px(x.b));
  const mode = fresh ? 'band' : Math.min(da, db) <= 16 ? (da <= db ? 'a' : 'b') : m > x.a && m < x.b ? 'band' : Math.abs(m - x.a) < Math.abs(m - x.b) ? 'a' : 'b';
  blDrag = { d, x, at, mode, off: m - x.a, len: x.b - x.a, S0, S1, bar };
  bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); e.preventDefault();
  if (mode === 'band') blApply(d); else blDragMove(e);
});
document.addEventListener('pointermove', e => { if (blDrag) blDragMove(e); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (blDrag) { blDrag.bar.classList.remove('drag'); blDrag = null; } }));
document.addEventListener('click', e => {
  const m = e.target.closest('[data-blmode]');
  if (m) {
    blMulti = m.dataset.blmode === '0';
    m.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === m));
    $('blToF').hidden = !blMulti; $('blFromL').textContent = blMulti ? 'Első nap' : 'Melyik nap?';
    const f = $('bf').elements; if (blMulti && f.to.value < f.from.value) f.to.value = f.from.value;
    blLoad(); return;
  }
  const t = e.target.closest('[data-blwhole],[data-blall]'); if (!t) return;
  const v = t.dataset.v === '1';
  if (t.dataset.blwhole) { blDay(t.dataset.blwhole).whole = v; blPatch(t.dataset.blwhole); }
  else { blAll.whole = v; blRange().days.forEach(d => { blDay(d).whole = v; blPatch(d); }); blPatchAll(); }
  blSummary();
});
async function unblock(id){ const batch = writeBatch(db); batch.delete(doc(db, 'busy', id)); await batch.commit(); toast('Zárolás feloldva.'); await render(); }
async function refresh(){ await loadPending(); await render(); }

async function uploadGallery(files){
  const room = GAL_MAX - gal.length;
  if (files.length > room) toast(`Legfeljebb ${GAL_MAX} kép lehet, ezért ${files.length - Math.max(room, 0)} kép kimaradt.`);
  files = files.slice(0, Math.max(room, 0));
  if (!files.length) return;
  busyUp = true; $('view').innerHTML = vGal();
  let next = gal.length ? Math.max(...gal.map(g => g.order ?? 0)) + 1 : 0, ok = 0;
  for (const f of files){
    try { const img = await compressImage(f, 1400, 600000); const b = writeBatch(db); b.set(doc(collection(db, 'gallery')), { img, caption: '', order: next++, created: serverTimestamp() }); await b.commit(); ok++; }
    catch (e) { console.error(e); toast((f.name ? f.name + ': ' : '') + (e.message || 'nem sikerült feltölteni.')); }
  }
  busyUp = false; if (ok) toast(`${ok} kép feltöltve.`); await render();
}
async function swapOrder(coll, list, id, dir){
  const i = list.findIndex(x => x.id === id), j = i + dir; if (i < 0 || j < 0 || j >= list.length) return;
  // a sorrend mindig 0..n-1, így a régi vagy egyforma értékek sem okoznak gondot
  const arr = list.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  const b = writeBatch(db); arr.forEach((x, k) => { if (x.order !== k) b.update(doc(db, coll, x.id), { order: k }); }); await b.commit(); await render();
}
async function delDoc(coll, id, msg){ if (!confirm(msg)) return; const b = writeBatch(db); b.delete(doc(db, coll, id)); await b.commit(); toast('Törölve.'); await render(); }
async function uploadHero(file){
  try { toast('Feltöltés…'); const img = await compressImage(file, 1920, 700000); await setDoc(doc(db, 'settings', 'hero'), { img, updated: serverTimestamp() }); toast('Nyitókép elmentve.'); await render(); }
  catch (e) { console.error(e); toast(e.message || 'Nem sikerült feltölteni.'); }
}
async function saveProduct(e){
  e.preventDefault();
  const f = e.target, v = n => f.elements[n].value.trim(), old = editProd === 'new' ? null : prods.find(x => x.id === editProd);
  const price = Math.round(Number(v('price'))), stock = v('stock') === '' ? null : Math.max(0, Math.round(Number(v('stock'))));
  if (!v('name')) { toast('Add meg a termék nevét.'); return; }
  if (!(price >= 0)) { toast('Adj meg egy érvényes árat.'); return; }
  const data = { name: v('name'), category: v('category'), price, stock, desc: f.elements.desc.value.trim(), visible: f.elements.visible.checked,
    img: old?.img || null, order: old ? old.order ?? 0 : (prods.length ? Math.max(...prods.map(p => p.order ?? 0)) + 1 : 0) };
  try {
    const file = f.elements.img.files[0];
    if (file) data.img = await compressImage(file, 1000, 400000);
    else if (f.elements.noimg?.checked) data.img = null;
    await setDoc(old ? doc(db, 'products', old.id) : doc(collection(db, 'products')), data);
    editProd = null; toast('Termék elmentve.'); await render();
  } catch (x) { console.error(x); toast(x.message || 'Nem sikerült menteni.'); }
}
async function setOrder(id, st){
  const o = orders.find(x => x.id === id);
  if (st === 'cancelled' && !confirm(`Lemondod ${o?.name || 'a vendég'} rendelését? E-mailt kap róla.`)) return;
  const patch = { status: st };
  if (st === 'ready' || st === 'cancelled') patch.mailed = false;  // az e-mail-szkript küld levelet a vendégnek
  if (st === 'cancelled') patch.cancelledBy = 'admin';
  try { await updateDoc(doc(db, 'orders', id), patch); ping(); toast(st === 'ready' ? 'Átvehető. A vendég e-mailt kap.' : st === 'done' ? 'Lezárva.' : 'Lemondva.'); await render(); }
  catch (e) { console.error(e); toast('Hiba történt.'); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-acc],[data-rej],[data-ban],[data-day],[data-mon],[data-act],[data-unblock],[data-acancel],[data-remind],[data-gmove],[data-gdel],[data-pmove],[data-pdel],[data-pedit],[data-ost]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; showNew = false; editProd = null; render(); }
  else if (d.gmove) swapOrder('gallery', gal, d.gmove, Number(d.d));
  else if (d.gdel) delDoc('gallery', d.gdel, 'Törlöd ezt a képet?');
  else if (d.pmove) swapOrder('products', prods, d.pmove, Number(d.d));
  else if (d.pdel) delDoc('products', d.pdel, 'Törlöd ezt a terméket?');
  else if (d.pedit) { editProd = d.pedit; $('view').innerHTML = vShop(); $('pf').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (d.ost) setOrder(d.ost, d.s);
  else if (d.act === 'newprod') { editProd = 'new'; $('view').innerHTML = vShop(); }
  else if (d.act === 'cancelprod') { editProd = null; $('view').innerHTML = vShop(); }
  else if (d.act === 'herodel') { if (confirm('Törlöd a nyitóképet?')) { const b = writeBatch(db); b.delete(doc(db, 'settings', 'hero')); await b.commit(); toast('Nyitókép törölve.'); await render(); } }
  else if (d.acc) accept(d.acc);
  else if (d.rej) reject(d.rej);
  else if (d.ban) reject(d.ban, true);
  else if (d.acancel) adminCancel(d.acancel);
  else if (d.remind) { try { await updateDoc(doc(db, 'bookings', d.remind), { remindNow: true }); ping(); toast('Az emlékeztető hamarosan kimegy.'); await render(); } catch (x) { console.error(x); toast('Nem sikerült.'); } }
  else if (d.unblock) { if (confirm('Feloldod a zárolást?')) unblock(d.unblock); }
  else if (d.day) { selDay = d.day; showNew = false; $('view').innerHTML = vCal(); }
  else if (d.mon) { const x = parse(calMonth); x.setMonth(x.getMonth() + Number(d.mon)); calMonth = toStr(x); selDay = calMonth; render(); }
  else if (d.act === 'new') { showNew = true; $('view').innerHTML = vCal(); $('nf').scrollIntoView({ behavior: 'smooth' }); }
  else if (d.act === 'cancelnew') { showNew = false; $('view').innerHTML = vCal(); }
  else if (d.act === 'preview') preview();
  else if (d.act === 'tplreset') { const f = $('sf'); f.elements.reminderSubject.value = DEFAULT_PRIVATE.reminderSubject; f.elements.reminderBody.value = DEFAULT_PRIVATE.reminderBody; }
});
document.addEventListener('submit', e => { if (e.target.id === 'nf') addBooking(e); if (e.target.id === 'bf') addBlock(e); if (e.target.id === 'pf') saveProduct(e); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.form && t.form.id === 'bf' && t.type === 'date') blLoad();
  if (t.dataset.blon) { blDay(t.dataset.blon).on = t.checked; blPatch(t.dataset.blon); blSummary(); }
  if (t.id === 'galup') uploadGallery([...t.files]);
  if (t.id === 'heroup' && t.files[0]) uploadHero(t.files[0]);
  if (t.dataset.cap) { try { await updateDoc(doc(db, 'gallery', t.dataset.cap), { caption: t.value.trim() }); const g = gal.find(x => x.id === t.dataset.cap); if (g) g.caption = t.value.trim(); toast('Felirat mentve.'); } catch (x) { console.error(x); toast('Nem sikerült menteni.'); } }
  if (t.id === 'galon') { const pub = { ...PUB, galleryEnabled: t.checked };
    try { await setDoc(doc(db, 'settings', 'public'), pub); PUB = pub; toast(t.checked ? 'A Munkáim most már látható.' : 'A Munkáim elrejtve.'); } catch (x) { console.error(x); t.checked = !t.checked; toast('Nem sikerült menteni.'); } }
  if (t.id === 'shopon') { const pub = { ...PUB, shopEnabled: t.checked };
    try { await setDoc(doc(db, 'settings', 'public'), pub); PUB = pub; toast(t.checked ? 'A webshop most már látható.' : 'A webshop elrejtve.'); } catch (x) { console.error(x); t.checked = !t.checked; toast('Nem sikerült menteni.'); } }
});

onAuthStateChanged(auth, async u => {
  user = u;
  if (!u) return loginView();
  try {
    const a = await getDoc(doc(db, 'admins', u.uid));
    if (!a.exists()) { await signOut(auth); return loginView('Ehhez a fiókhoz nincs admin jogosultság.'); }
    await loadSettings(); await loadPending(); try { await loadOrders(); } catch (x) { console.error(x); } shell(); await render();
  } catch (e) { console.error(e); loginView('Nem sikerült betölteni az adatokat. Ellenőrizd a beállításokat.'); }
});
</script>
