<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bendi">
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<title>Bendi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea;--card:#fffdf9;--ink:#1d1a17;--muted:#7a6f64;--line:#e8ded1;--soft:#efe7dc;
  --brass:#a8702f;--brass-ink:#ffffff;--brass-soft:#f3e6d4;
  --ok:#2f7d4f;--ok-bg:#e4f1e8;--warn:#9a5810;--warn-bg:#fbeedb;--bad:#b3362c;--bad-bg:#f8e2df;
  --wa:#0a84ff;--shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f;--card:#201c17;--ink:#f3ece2;--muted:#a89a8a;--line:#332c24;--soft:#2a241e;
    --brass:#d39a55;--brass-ink:#16130f;--brass-soft:#3a2d1e;
    --ok:#6fcf97;--ok-bg:#1d3226;--warn:#f0b35c;--warn-bg:#3a2a14;--bad:#f08a7e;--bad-bg:#3d1f1b;
    --wa:#0a84ff;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0;flex:1}
.brand small{display:block;font:500 12px/1 -apple-system,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.back{width:40px;height:40px;border-radius:50%;padding:0;font-size:20px}
main{padding:0 16px;max-width:560px;margin:0 auto}
h2{font-family:Fraunces,Georgia,serif;font-size:20px;margin:18px 0 10px;font-weight:600}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
button.primary,.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.4}
.wa{background:var(--wa);color:#fff;border-color:var(--wa);font-weight:600}
.wa.sent{opacity:.55}
.ms{background:#0866ff;color:#fff;border-color:#0866ff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row.full > *{flex:1}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:46px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent}
textarea{min-height:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:14px;margin:4px 0 12px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* calendar */
.monthbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.monthbar .t{flex:1;text-align:center;font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;text-transform:capitalize}
.monthbar button{width:44px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0 6px}
.cal .d{aspect-ratio:1;border:0;border-radius:12px;background:none;min-height:0;padding:0;flex-direction:column;gap:3px;font-size:15px}
.cal .d.today{color:var(--brass);font-weight:700}
.cal .d.sel{background:var(--ink);color:var(--bg)}
.cal .d.past{color:var(--muted)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brass)}
.cal .d.sel .dots i{background:var(--bg)}
.chips{display:flex;gap:8px;margin:12px 0 0}
.chip{min-height:36px;padding:6px 14px;border-radius:999px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* appointments */
.appt{display:flex;gap:12px;align-items:stretch;cursor:pointer}
.appt .tm{min-width:58px;border-right:2px solid var(--brass);padding-right:10px}
.appt .tm b{display:block;font-size:18px}
.appt .tm span{font-size:12px;color:var(--muted)}
.appt .info{flex:1;min-width:0}
.appt .nm{font-weight:600;font-size:16px}
.appt.cx{opacity:.55}
.appt.cx .tm{border-color:var(--line)}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-n{background:var(--soft);color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button.on-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button.on-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg button.on-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}

/* guests */
.search{position:relative}
.search input{padding-left:40px}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:20px;color:var(--muted)}
.g{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.g:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--brass-soft);color:var(--brass);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.g .nm{font-weight:600}
.g .flags{margin-left:auto;display:flex;gap:4px}
.picked{display:flex;align-items:center;gap:12px;background:var(--brass-soft);border-radius:14px;padding:10px 12px}
.picked .nm{font-weight:600;flex:1}
.res{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 10px}
.res:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tile b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px}
.tile span{font-size:12px;color:var(--muted)}
.stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 6px env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:6px 2px 8px;font-size:11px;flex-direction:column;gap:2px;color:var(--muted);min-height:0}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--ink);font-weight:600}
nav .plus .ic{width:52px;height:52px;border-radius:50%;background:var(--brass);color:var(--brass-ink);display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-22px;box-shadow:0 4px 14px rgba(168,112,47,.35)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav id="nav">
  <button data-go="cal"><span class="ic">◷</span>Naptár</button>
  <button data-go="guests"><span class="ic">☺</span>Vendégek</button>
  <button data-go="book" class="plus" aria-label="Új foglalás"><span class="ic">+</span>Foglalás</button>
  <button data-go="stats"><span class="ic">▤</span>Mérés</button>
  <button data-go="settings"><span class="ic">⚙︎</span>Beállítás</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'bendi_v2', OLD_KEY = 'szalon_naplo_v1';
const OLD_TPL = 'Szia {nev}! Emlékeztetlek: {nap} {ido}-kor vár a szék Bendinél.\n\n✅ Megerősítem: {megerosit}\n❌ Lemondom: {lemond}\n\nKöszi!';
const DEF_TPL = 'Szia {nev}! Emlékeztetlek: {nap} {ido}-kor vár a szék Bendinél.\n\nKérlek, válaszolj egy számmal:\n1 – jövök\n2 – lemondom\n\nKöszi!';
const ST = { confirmed:['Megerősítve','ok'], cancelled:['Lemondva','warn'], came:['Eljött','ok'], noshow:['Nem jött','bad'] };
const blank = () => ({ guests:[], appts:[], template:DEF_TPL, lastBackup:null });
let S = blank(), storageOk = true;
let view = 'cal', param = null, back = null;
let calMonth, selDay, bk = null, guestPrefill = '';

/* ---------- storage ---------- */
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) { S = Object.assign(blank(), JSON.parse(s)); if (S.template === OLD_TPL) { S.template = DEF_TPL; save(); } return; }
    const old = localStorage.getItem(OLD_KEY);
    if (old) { S = migrate(JSON.parse(old)); save(); }
  } catch(e){ storageOk = false; }
}
// Az első verzió (Szalon Napló) időpontjaiból vendégeket és foglalásokat készít, hogy semmi ne vesszen el.
function migrate(o){
  const n = blank(); n.lastBackup = o.lastBackup || null;
  for (const a of (o.appts || [])){
    let g = n.guests.find(x => normPhone(x.phone) === normPhone(a.phone));
    if (!g){ g = { id:uid(), name:a.name, phone:a.phone, note:'', created:Date.now() }; n.guests.push(g); }
    n.appts.push({ id:a.id || uid(), guestId:g.id, date:a.date, time:a.time, dur:60, service:a.note || '', status:a.status || null, reminded:!!a.reminded });
  }
  return n;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOk = false; toast('Nem sikerült menteni a telefonra!'); } }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const toStr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => toStr(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return toStr(d); };
const fmtDate = s => parse(s).toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'});
const fmtShort = s => parse(s).toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'});
const dayLabel = s => s===today() ? 'ma' : s===addDays(today(),1) ? 'holnap' : fmtDate(s);
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const endTime = a => { const m = mins(a.time) + (+a.dur||60); return pad(Math.floor(m/60)%24)+':'+pad(m%60); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const guest = id => S.guests.find(g => g.id === id) || { name:'(törölt vendég)', phone:'' };
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
const firstName = n => n.trim().split(/\s+/).pop(); // magyar névsorrend: a keresztnév a végén
const byTime = (a,b) => (a.date+a.time).localeCompare(b.date+b.time);
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

// Magyar szám -> nemzetközi formátum (06 30 123 4567 -> 36301234567)
function normPhone(p){
  let d = String(p||'').replace(/\D/g,'');
  if (d.startsWith('0036')) d = d.slice(2);
  else if (d.startsWith('06')) d = '36' + d.slice(2);
  else if (d.length === 9 && /^(20|30|31|50|70)/.test(d)) d = '36' + d;
  return d;
}
function guestStats(gid){
  const l = S.appts.filter(a => a.guestId === gid);
  const c = s => l.filter(a => a.status === s).length;
  return { total:l.length, came:c('came'), cancelled:c('cancelled'), noshow:c('noshow') };
}
function message(a){
  const g = guest(a.guestId);
  return S.template.replaceAll('{nev}', firstName(g.name)).replaceAll('{ido}', a.time).replaceAll('{nap}', dayLabel(a.date))
    .split('\n').filter(l => !/\{megerosit\}|\{lemond\}/.test(l)).join('\n').replace(/\n{3,}/g,'\n\n').trim(); // régi link-helyettesítők kimaradnak
}
// iPhone-on az sms: link iMessage-t küld, ha a vendégnek is iPhone-ja van, különben SMS-t. iOS "&body=", Android "?body=".
const isIOS = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const msgLink = a => 'sms:+' + normPhone(guest(a.guestId).phone) + (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(message(a));
function sendMessenger(id){
  const a = S.appts.find(x => x.id === id), g = guest(a.guestId), url = 'https://m.me/' + encodeURIComponent(g.messenger);
  const done = () => { markReminded(id); location.href = url; };
  // shortcut: a Messenger nem fogad előre kitöltött szöveget, ezért vágólapra másoljuk; ha a böngésző ezt tiltja, a szöveg felugró ablakban jelenik meg
  if (navigator.clipboard) navigator.clipboard.writeText(message(a)).then(() => { toast('Üzenet kimásolva – a Messengerben illeszd be'); setTimeout(done, 900); }, () => { prompt('Másold ki az üzenetet:', message(a)); done(); });
  else { prompt('Másold ki az üzenetet:', message(a)); done(); }
}
const badge = s => s && ST[s] ? `<span class="badge b-${ST[s][1]}">${ST[s][0]}</span>` : '';

/* ---------- routing ---------- */
function go(v, p=null, from=null){ view = v; param = p; back = from; render(); window.scrollTo(0,0); }
function render(){
  const titles = { cal:'Naptár', guests:'Vendégek', book:bk && bk.editId ? 'Időpont módosítása' : 'Új foglalás', stats:'Mérés', settings:'Beállítás', appt:'Időpont', guest:'Vendég', guestForm:param ? 'Vendég szerkesztése' : 'Új vendég' };
  const top = ['cal','guests','stats','settings'].includes(view) && !back;
  document.getElementById('hdr').innerHTML = top
    ? `<h1 class="brand">Bendi<small>${esc(titles[view])}</small></h1>`
    : `<button class="back" onclick="goBack()" aria-label="Vissza">‹</button><h1 class="brand" style="font-size:22px">${esc(titles[view])}</h1>`;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  document.getElementById('view').innerHTML = ({cal:vCal, guests:vGuests, book:vBook, stats:vStats, settings:vSettings, appt:vAppt, guest:vGuest, guestForm:vGuestForm})[view]();
}
function goBack(){ if (back) { const b = back; go(b.v, b.p, b.from || null); } else go('cal'); }

/* ---------- calendar ---------- */
function warnings(){
  if (!storageOk) return '<div class="warnbox">A böngésző nem engedi az adatok mentését. Ne privát/inkognitó módban használd!</div>';
  let h = '';
  if (S.appts.length && (!S.lastBackup || (Date.now()-S.lastBackup)/864e5 > 7)) h += `<div class="warnbox">${S.lastBackup ? 'Több mint egy hete nem volt' : 'Még nem volt'} biztonsági mentés. Beállítás → Mentés letöltése.</div>`;
  return h;
}
function vCal(){
  const t = today(), d0 = parse(calMonth), y = d0.getFullYear(), m = d0.getMonth();
  const offset = (d0.getDay()+6)%7, n = new Date(y, m+1, 0).getDate();
  let cells = ['H','K','Sze','Cs','P','Szo','V'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i=0;i<offset;i++) cells += '<div></div>';
  for (let d=1; d<=n; d++){
    const ds = toStr(new Date(y,m,d)), k = S.appts.filter(a => a.date===ds && a.status!=='cancelled').length;
    cells += `<button class="d ${ds===t?'today':''} ${ds===selDay?'sel':''} ${ds<t?'past':''}" onclick="pickDay('${ds}')" aria-label="${esc(fmtDate(ds))}, ${k} időpont">${d}<span class="dots">${'<i></i>'.repeat(Math.min(k,4))}</span></button>`;
  }
  const list = S.appts.filter(a => a.date === selDay).sort(byTime);
  let h = warnings() + `<div class="monthbar"><button onclick="shiftMonth(-1)" aria-label="Előző hónap">‹</button><div class="t">${esc(d0.toLocaleDateString('hu-HU',{year:'numeric',month:'long'}))}</div><button onclick="shiftMonth(1)" aria-label="Következő hónap">›</button></div>
    <div class="cal">${cells}</div>
    <div class="chips"><button class="chip ${selDay===t?'on':''}" onclick="pickDay('${t}')">Ma</button><button class="chip ${selDay===addDays(t,1)?'on':''}" onclick="pickDay('${addDays(t,1)}')">Holnap</button></div>
    <h2>${esc(fmtDate(selDay))}</h2>`;
  if (!list.length) return h + `<div class="empty">Erre a napra nincs foglalás.<div class="row" style="justify-content:center"><button class="primary" onclick="newBooking('${selDay}')">+ Foglalás erre a napra</button></div></div>`;
  for (const a of list){
    const g = guest(a.guestId), canRemind = a.date >= t && a.status !== 'cancelled' && a.status !== 'came';
    h += `<div class="card appt ${a.status==='cancelled'?'cx':''}" onclick="go('appt','${a.id}',{v:'cal'})">
      <div class="tm"><b>${esc(a.time)}</b><span>${esc(endTime(a))}-ig</span></div>
      <div class="info"><div class="nm">${esc(g.name)}</div><div class="muted">${esc(a.service || 'Időpont')}</div>
        <div class="row" style="margin-top:8px;align-items:center">${badge(a.status) || (a.reminded ? '<span class="badge b-n">Emlékeztetve</span>' : '')}
        ${canRemind ? `<a class="btn wa ${a.reminded?'sent':''}" style="margin-left:auto;min-height:38px;padding:6px 12px" href="${esc(msgLink(a))}" onclick="event.stopPropagation();markReminded('${a.id}')">${a.reminded?'Újra':'Üzenet'}</a>` : ''}</div>
      </div></div>`;
  }
  return h + `<div class="row" style="justify-content:center"><button onclick="newBooking('${selDay}')">+ Újabb foglalás erre a napra</button></div>`;
}
function pickDay(ds){ selDay = ds; calMonth = ds.slice(0,8)+'01'; render(); }
function shiftMonth(k){ const d = parse(calMonth); d.setMonth(d.getMonth()+k); calMonth = toStr(d); render(); }

/* ---------- appointment detail ---------- */
function vAppt(){
  const a = S.appts.find(x => x.id === param); if (!a) return '<div class="empty">Ez az időpont már nem létezik.</div>';
  const g = guest(a.guestId), s = (k, cls, label) => `<button class="${a.status===k?'on-'+cls:''}" onclick="setStatus('${a.id}','${k}')">${label}</button>`;
  const canRemind = a.date >= today() && a.status !== 'cancelled' && a.status !== 'came';
  return `<div class="card">
      <div class="g" style="border:0;padding:0" onclick="go('guest','${a.guestId}',{v:'appt',p:'${a.id}'})"><div class="av">${esc(initials(g.name))}</div><div><div class="nm">${esc(g.name)}</div><div class="muted">${esc(g.phone)}</div></div><span class="muted" style="margin-left:auto">›</span></div>
      <h3>Időpont</h3><div style="font-size:18px;font-weight:600">${esc(fmtDate(a.date))}</div><div>${esc(a.time)}–${esc(endTime(a))} · ${esc(a.service || 'Időpont')}</div>
      ${canRemind ? `<div class="row full"><a class="btn wa ${a.reminded?'sent':''}" href="${esc(msgLink(a))}" onclick="markReminded('${a.id}')">${a.reminded?'Újraküldés':'Emlékeztető'} (iMessage/SMS)</a></div>${g.messenger ? `<div class="row full"><button class="ms" onclick="sendMessenger('${a.id}')">Emlékeztető Messengeren</button></div>` : ''}` : ''}
    </div>
    <h3>Mi lett vele?</h3>
    <div class="seg">${s('confirmed','ok','✓ Megerősítette')}${s('cancelled','warn','Lemondta')}${s('came','ok','Eljött')}${s('noshow','bad','Nem jött el')}</div>
    <p class="muted">Ha a vendég válaszol (1 = jön, 2 = lemondja), itt jelöld be. Még egy koppintás visszavonja a jelölést.</p>
    <div class="row full"><button onclick="editBooking('${a.id}')">Módosítás</button><button class="danger" onclick="delAppt('${a.id}')">Törlés</button></div>`;
}
function setStatus(id, s){ const a = S.appts.find(x => x.id === id); a.status = a.status === s ? null : s; save(); render(); toast(a.status ? ST[s][0] : 'Jelölés törölve'); }
function markReminded(id){ const a = S.appts.find(x => x.id === id); if (a){ a.reminded = true; save(); setTimeout(render, 400); } }
function delAppt(id){ if (!confirm('Biztosan törlöd ezt az időpontot? Ha a vendég lemondta, inkább jelöld „Lemondta”-nak, hogy beleszámítson a statisztikába.')) return; const a = S.appts.find(x => x.id === id); S.appts = S.appts.filter(x => x.id !== id); save(); selDay = a.date; go('cal'); toast('Törölve'); }

/* ---------- booking ---------- */
function newBooking(date, guestId=null){ bk = { guestId, date: date || selDay || today(), time:'10:00', dur:60, service:'', editId:null }; go('book', null, view==='book' ? null : {v:view, p:param, from:back}); }
function editBooking(id){ const a = S.appts.find(x => x.id === id); bk = { guestId:a.guestId, date:a.date, time:a.time, dur:a.dur, service:a.service, editId:id }; go('book', null, {v:'appt', p:id}); }
function vBook(){
  if (!bk) bk = { guestId:null, date:selDay || today(), time:'10:00', dur:60, service:'', editId:null };
  const durs = [15,30,45,60,90,120,180];
  return `<label>Vendég</label><div id="picker">${pickerHtml()}</div>
    <div class="two"><div><label for="b-date">Nap</label><input id="b-date" type="date" value="${esc(bk.date)}" onchange="bk.date=this.value"></div>
    <div><label for="b-time">Kezdés</label><input id="b-time" type="time" step="300" value="${esc(bk.time)}" onchange="bk.time=this.value"></div></div>
    <label for="b-dur">Időtartam</label><select id="b-dur" onchange="bk.dur=+this.value">${durs.map(d => `<option value="${d}" ${+bk.dur===d?'selected':''}>${d < 60 ? d+' perc' : (d/60)+' óra'}</option>`).join('')}</select>
    <label for="b-svc">Szolgáltatás (nem kötelező)</label><input id="b-svc" value="${esc(bk.service)}" placeholder="pl. hajvágás, szakáll, festés" oninput="bk.service=this.value">
    <div class="row full" style="margin-top:20px"><button class="primary" onclick="saveBooking()">${bk.editId ? 'Módosítás mentése' : 'Foglalás mentése'}</button></div>`;
}
function pickerHtml(){
  if (bk.guestId){ const g = guest(bk.guestId); return `<div class="picked"><div class="av">${esc(initials(g.name))}</div><div class="nm">${esc(g.name)}<div class="muted" style="font-weight:400">${esc(g.phone)}</div></div><button class="ghost" onclick="bk.guestId=null;document.getElementById('picker').innerHTML=pickerHtml();document.getElementById('gq').focus()">Csere</button></div>`; }
  return `<div class="search"><input id="gq" placeholder="Vendég keresése név vagy szám alapján…" autocomplete="off" oninput="pickSearch(this.value)" aria-label="Vendég keresése"></div><div class="res" id="gres"></div>`;
}
function matchGuests(q){
  const f = fold(q.trim()), digits = q.replace(/\D/g,'');
  return S.guests.filter(g => !f || fold(g.name).includes(f) || (digits.length >= 3 && (g.phone.replace(/\D/g,'').includes(digits) || normPhone(g.phone).includes(normPhone(digits)))))
    .sort((a,b) => a.name.localeCompare(b.name,'hu'));
}
function pickSearch(q){
  const el = document.getElementById('gres'); if (!q.trim()){ el.innerHTML = ''; return; }
  const r = matchGuests(q).slice(0,8);
  el.innerHTML = r.map(g => `<div class="g" onclick="pickGuest('${g.id}')"><div class="av">${esc(initials(g.name))}</div><div><div class="nm">${esc(g.name)}</div><div class="muted">${esc(g.phone)}</div></div>${flags(g.id)}</div>`).join('')
    + `<div class="g" onclick="newGuestFromBooking()"><div class="av">+</div><div class="nm">Új vendég: „${esc(q.trim())}”</div></div>`;
}
function pickGuest(id){ bk.guestId = id; document.getElementById('picker').innerHTML = pickerHtml(); }
function newGuestFromBooking(){ guestPrefill = document.getElementById('gq').value.trim(); go('guestForm', null, {v:'book'}); }
function saveBooking(){
  if (!bk.guestId) { toast('Válassz vendéget!'); return; }
  bk.date = document.getElementById('b-date').value; bk.time = document.getElementById('b-time').value;
  if (!bk.date || !bk.time) { toast('Add meg a napot és az időt!'); return; }
  const s = mins(bk.time), e = s + bk.dur;
  const clash = S.appts.find(a => a.id !== bk.editId && a.date === bk.date && a.status !== 'cancelled' && mins(a.time) < e && s < mins(a.time) + (+a.dur||60));
  if (clash && !confirm('Ütközik ezzel: ' + guest(clash.guestId).name + ' ' + clash.time + '–' + endTime(clash) + '. Mégis mented?')) return;
  if (bk.editId){
    const a = S.appts.find(x => x.id === bk.editId);
    if (a.date !== bk.date || a.time !== bk.time) { a.reminded = false; if (a.status === 'confirmed') a.status = null; }
    Object.assign(a, { guestId:bk.guestId, date:bk.date, time:bk.time, dur:bk.dur, service:bk.service.trim() });
  } else {
    S.appts.push({ id:uid(), guestId:bk.guestId, date:bk.date, time:bk.time, dur:bk.dur, service:bk.service.trim(), status:null, reminded:false });
  }
  save(); selDay = bk.date; calMonth = bk.date.slice(0,8)+'01'; bk = null; go('cal'); toast('Foglalás elmentve');
}

/* ---------- guests ---------- */
function flags(gid){
  const s = guestStats(gid);
  return `<div class="flags">${s.cancelled ? `<span class="badge b-warn" title="Lemondások">${s.cancelled}× lemondta</span>` : ''}${s.noshow ? `<span class="badge b-bad" title="Nem jött el">${s.noshow}× nem jött</span>` : ''}</div>`;
}
function vGuests(){
  return `<div class="row full" style="margin-top:0"><button class="primary" onclick="guestPrefill='';go('guestForm',null,{v:'guests'})">+ Új vendég</button></div>
    <div class="search" style="margin-top:12px"><input placeholder="Keresés…" autocomplete="off" oninput="document.getElementById('glist').innerHTML=guestRows(this.value)" aria-label="Vendég keresése"></div>
    <div class="card" style="margin-top:12px;padding:2px 12px" id="glist">${guestRows('')}</div>`;
}
function guestRows(q){
  const r = matchGuests(q);
  if (!S.guests.length) return '<div class="empty">Még nincs vendég. Vedd fel az elsőt a fenti gombbal.</div>';
  if (!r.length) return '<div class="empty">Nincs találat.</div>';
  return r.map(g => { const s = guestStats(g.id); return `<div class="g" onclick="go('guest','${g.id}',{v:'guests'})"><div class="av">${esc(initials(g.name))}</div><div style="min-width:0"><div class="nm">${esc(g.name)}</div><div class="muted">${s.came} alkalom</div></div>${flags(g.id)}</div>`; }).join('');
}
function vGuest(){
  const g = S.guests.find(x => x.id === param); if (!g) return '<div class="empty">Ez a vendég már nem létezik.</div>';
  const s = guestStats(g.id), t = today();
  const list = S.appts.filter(a => a.guestId === g.id).sort(byTime).reverse();
  const up = list.filter(a => a.date >= t && a.status !== 'cancelled').reverse();
  const past = list.filter(a => !(a.date >= t && a.status !== 'cancelled'));
  const row = a => `<div class="stat" style="cursor:pointer" onclick="go('appt','${a.id}',{v:'guest',p:'${g.id}'})"><span>${esc(fmtShort(a.date))} ${esc(a.time)}<span class="muted"> · ${esc(a.service || 'Időpont')}</span></span>${badge(a.status)}</div>`;
  return `<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av" style="width:56px;height:56px;font-size:20px">${esc(initials(g.name))}</div>
      <div style="flex:1;min-width:0"><div style="font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600">${esc(g.name)}</div><a class="muted" href="tel:${esc(g.phone)}">${esc(g.phone)}</a>${g.note ? `<div class="muted">${esc(g.note)}</div>` : ''}</div></div>
    <div class="tiles"><div class="tile"><b>${s.came}</b><span>alkalom</span></div><div class="tile"><b style="color:var(--warn)">${s.cancelled}</b><span>lemondás</span></div><div class="tile"><b style="color:var(--bad)">${s.noshow}</b><span>nem jött el</span></div></div>
    <div class="row full"><button class="primary" onclick="newBooking(null,'${g.id}')">Időpont foglalása</button><button onclick="go('guestForm','${g.id}',{v:'guest',p:'${g.id}'})">Szerkesztés</button></div>
    ${up.length ? `<h3>Közelgő</h3><div class="card" style="padding:2px 14px">${up.map(row).join('')}</div>` : ''}
    <h3>Korábbi</h3>${past.length ? `<div class="card" style="padding:2px 14px">${past.map(row).join('')}</div>` : '<div class="muted">Még nincs korábbi időpont.</div>'}`;
}
function vGuestForm(){
  const g = param ? S.guests.find(x => x.id === param) : null;
  return `<label for="g-name">Név</label><input id="g-name" value="${esc(g ? g.name : guestPrefill)}" placeholder="Vezetéknév Keresztnév" autocomplete="off">
    <label for="g-phone">Telefonszám</label><input id="g-phone" type="tel" inputmode="tel" value="${esc(g?.phone)}" placeholder="06 30 123 4567">
    <label for="g-ms">Messenger-felhasználónév (nem kötelező)</label><input id="g-ms" value="${esc(g?.messenger)}" placeholder="pl. kovacs.peter.12" autocomplete="off" autocapitalize="off">
    <p class="muted" style="margin:4px 0 0">Csak ha Messengeren kéri az emlékeztetőt. A Facebook-profilja linkjének utolsó része (facebook.com/<b>ez</b>).</p>
    <label for="g-note">Megjegyzés (nem kötelező)</label><input id="g-note" value="${esc(g?.note)}" placeholder="pl. mindig rövid oldalt, allergiás valamire">
    <div class="row full" style="margin-top:20px"><button class="primary" onclick="saveGuest()">Mentés</button></div>
    ${g ? `<div class="row full"><button class="danger" onclick="delGuest('${g.id}')">Vendég törlése</button></div>` : ''}`;
}
function saveGuest(){
  const name = document.getElementById('g-name').value.trim(), phone = document.getElementById('g-phone').value.trim(), note = document.getElementById('g-note').value.trim(), messenger = document.getElementById('g-ms').value.trim().replace(/^.*\//,'').replace(/[?#].*$/,'');
  if (!name) { toast('Add meg a nevet!'); return; }
  if (normPhone(phone).length < 10) { toast('Ellenőrizd a telefonszámot!'); return; }
  const dup = S.guests.find(x => x.id !== param && normPhone(x.phone) === normPhone(phone));
  if (dup && !confirm('Ezzel a számmal már szerepel: ' + dup.name + '. Mégis új vendégként mented?')) return;
  if (param) Object.assign(S.guests.find(x => x.id === param), { name, phone, note, messenger });
  else {
    const g = { id:uid(), name, phone, note, messenger, created:Date.now() }; S.guests.push(g);
    if (back && back.v === 'book' && bk) { bk.guestId = g.id; save(); go('book', null, null); toast('Vendég felvéve'); return; }
    save(); go('guest', g.id, {v:'guests'}); toast('Vendég felvéve'); return;
  }
  save(); goBack(); toast('Elmentve');
}
function delGuest(id){
  const n = S.appts.filter(a => a.guestId === id).length;
  if (!confirm('Biztosan törlöd a vendéget' + (n ? ' és a(z) ' + n + ' időpontját' : '') + '? Ez nem vonható vissza.')) return;
  S.guests = S.guests.filter(g => g.id !== id); S.appts = S.appts.filter(a => a.guestId !== id); save(); go('guests'); toast('Vendég törölve');
}

/* ---------- stats ---------- */
function vStats(){
  const done = S.appts.filter(a => ['came','noshow'].includes(a.status));
  const rate = l => l.length ? Math.round(l.filter(a => a.status==='noshow').length / l.length * 100) + '%' : '–';
  const cnt = l => l.length ? `<span class="muted">${l.filter(a => a.status==='noshow').length}/${l.length}</span>` : '';
  const withR = done.filter(a => a.reminded), noR = done.filter(a => !a.reminded);
  const open = S.appts.filter(a => !a.status && a.date < today()).length;
  const top = S.guests.map(g => ({ g, s:guestStats(g.id) })).filter(x => x.s.cancelled + x.s.noshow).sort((a,b) => (b.s.cancelled+b.s.noshow*2) - (a.s.cancelled+a.s.noshow*2)).slice(0,5);
  return `<div class="tiles"><div class="tile"><b>${S.appts.filter(a => a.status==='came').length}</b><span>megjelent</span></div><div class="tile"><b style="color:var(--warn)">${S.appts.filter(a => a.status==='cancelled').length}</b><span>lemondás</span></div><div class="tile"><b style="color:var(--bad)">${S.appts.filter(a => a.status==='noshow').length}</b><span>nem jött el</span></div></div>
    <h3>Elmaradási arány</h3><div class="card" style="padding:4px 14px">
      <div class="stat"><span>Emlékeztető nélkül</span><span><b>${rate(noR)}</b> ${cnt(noR)}</span></div>
      <div class="stat"><span>Emlékeztetővel</span><span><b>${rate(withR)}</b> ${cnt(withR)}</span></div></div>
    ${open ? `<div class="warnbox">${open} korábbi időpontnál még nincs bejelölve, mi lett vele. A naptárban visszalapozva pótolhatod.</div>` : ''}
    <h3>Legtöbbet lemondók</h3>${top.length ? `<div class="card" style="padding:2px 12px">${top.map(x => `<div class="g" onclick="go('guest','${x.g.id}',{v:'stats'})"><div class="av">${esc(initials(x.g.name))}</div><div class="nm">${esc(x.g.name)}</div>${flags(x.g.id)}</div>`).join('')}</div>` : '<div class="muted">Még nincs lemondás.</div>'}
    <p class="muted">Tipp: az első 2 hétben ne küldj emlékeztetőt, csak jelöld, ki jött el. Utána 2 hétig küldj mindenkinek. A két arány különbsége mutatja, mennyit ér az emlékeztető.</p>`;
}

/* ---------- settings ---------- */
function vSettings(){
  const lb = S.lastBackup ? new Date(S.lastBackup).toLocaleString('hu-HU') : 'még nem volt';
  return `<h3>Emlékeztető szövege</h3><div class="card">
      <p class="muted" style="margin-top:0">Helyettesítők: {nev} keresztnév, {nap} „holnap” vagy dátum, {ido} időpont.</p>
      <textarea id="tpl">${esc(S.template)}</textarea>
      <div class="row"><button class="primary" onclick="saveTpl()">Szöveg mentése</button><button onclick="S.template=DEF_TPL;save();render();toast('Visszaállítva')">Alaphelyzet</button></div></div>
    <h3>Biztonsági mentés</h3><div class="card">
      <p class="muted" style="margin-top:0">Az adatok csak ezen a telefonon vannak. Ha törlöd a böngészőadatokat vagy telefont cserélsz, elvesznek. Hetente ments egyet, és tedd a felhőbe vagy küldd el magadnak.</p>
      <p class="muted">Utolsó mentés: <b>${esc(lb)}</b> · ${S.guests.length} vendég, ${S.appts.length} időpont</p>
      <div class="row"><button class="primary" onclick="exportData()">Mentés letöltése</button>
      <label class="btn" style="margin:0;color:var(--ink);font-size:15px">Visszatöltés<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div></div>`;
}
function saveTpl(){ S.template = document.getElementById('tpl').value.trim() || DEF_TPL; save(); toast('Szöveg elmentve'); }
function exportData(){
  S.lastBackup = Date.now(); save();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'}));
  a.download = 'bendi-mentes-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  render(); toast('Mentés letöltve');
}
function importData(input){
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      let d = JSON.parse(r.result);
      if (!Array.isArray(d.guests)) { if (Array.isArray(d.appts)) d = migrate(d); else throw 0; }
      if (!confirm('A visszatöltés felülírja a mostani adatokat (' + S.guests.length + ' vendég, ' + S.appts.length + ' időpont). Folytatod?')) return;
      S = Object.assign(blank(), d); save(); render(); toast('Visszatöltve: ' + S.guests.length + ' vendég, ' + S.appts.length + ' időpont');
    } catch(e){ toast('Ez nem érvényes mentésfájl.'); }
  };
  r.readAsText(f); input.value = '';
}

/* ---------- start ---------- */
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go === 'book') newBooking(view === 'cal' ? selDay : null); else go(b.dataset.go);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'cal') render(); });
load(); selDay = today(); calMonth = selDay.slice(0,8)+'01'; render();
</script>
</body>
</html>
